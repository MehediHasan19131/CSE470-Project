<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('My Orders')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('My orders', 'Your medicine order history', 'bi-receipt')}"></div>

      <div class="alert alert-success" th:if="${orderPlaced}">
        <i class="bi bi-check-circle"></i> Your order was placed successfully.
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a href="/pharmacy-store" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-capsule"></i> Back to Pharmacy Store
        </a>
      </div>

      <div class="row g-4" th:if="${#lists.size(orders) > 0}">
        <div class="col-12 col-lg-6" th:each="order : ${orders}">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">
                  Order #<span th:text="${order.id}">1</span>
                </p>
                <span class="badge text-bg-light text-capitalize" th:text="${#strings.toLowerCase(order.status)}">pending</span>
              </div>
              <span class="small text-muted" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">date</span>
            </div>

            <div class="data-list">
              <div class="data-row" th:each="item : ${order.items}">
                <div>
                  <strong th:text="${item.medicineName}">Medicine</strong>
                  <span>Qty <span th:text="${item.quantity}">1</span> &times; ৳<span th:text="${item.unitPrice}">0</span></span>
                </div>
                <span class="badge text-bg-light">৳<span th:text="${item.subtotal}">0</span></span>
              </div>
            </div>

            <hr>

            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold">Total</span>
              <span class="h5 text-primary mb-0">৳<span th:text="${order.totalAmount}">0</span></span>
            </div>
            <p class="small text-muted mt-2 mb-0" th:if="${order.deliveryAddress}">
              <i class="bi bi-geo-alt"></i> <span th:text="${order.deliveryAddress}">Address</span>
            </p>
          </div>
        </div>
      </div>

      <div class="alert alert-secondary" th:if="${#lists.size(orders) == 0}">
        You haven't placed any orders yet. <a href="/pharmacy-store">Browse the pharmacy store</a> to get started.
      </div>
    </main>
  </body>
</html>
