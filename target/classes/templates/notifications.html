<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Notifications')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Notification center', 'Reminders and updates for your account', 'bi-bell')}"></div>

      <div class="d-flex justify-content-end mb-3" th:if="${#lists.size(notifications) > 0}">
        <form method="post" th:action="@{/notifications/read-all}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-check2-all"></i> Mark all as read
          </button>
        </form>
      </div>

      <div class="panel mb-3" th:each="notification : ${notifications}"
           th:classappend="${notification.read} ? '' : 'border border-primary'">
        <div class="section-title">
          <div>
            <span class="badge text-bg-light text-uppercase small" th:text="${#strings.replace(notification.type, '_', ' ')}">TYPE</span>
            <span class="badge text-bg-primary ms-1" th:unless="${notification.read}">New</span>
            <h2 class="h6 fw-bold mt-2 mb-1" th:text="${notification.title}">Title</h2>
          </div>
          <span class="small text-muted" th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy, HH:mm')}">date</span>
        </div>

        <p class="mb-2" th:text="${notification.message}">Message</p>

        <form method="post" th:action="@{'/notifications/' + ${notification.id} + '/read'}" th:unless="${notification.read}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-check2"></i> Mark as read
          </button>
        </form>
      </div>

      <div class="alert alert-secondary" th:if="${#lists.size(notifications) == 0}">
        You have no notifications yet.
      </div>
    </main>
  </body>
</html>
