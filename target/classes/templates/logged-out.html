<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCare: Integrated Healthcare Management and Telemedicine System</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <section class="logout-shell">
      <div class="logout-card">
        <a href="/" class="brand-logo brand-logo-logout" aria-label="SmartCare">
          <img src="/img/smartcare-icon.svg" alt="SmartCare" class="brand-logo-icon" width="96" height="96">
        </a>
        <div>
          <p class="text-uppercase text-primary small fw-semibold mb-2">Session ended</p>
          <h1 class="h3 fw-bold mb-2">You are safely signed out</h1>
          <p class="text-secondary mb-0">
            Your dashboard session has been closed. You can sign in again whenever you need to continue managing care services.
          </p>
        </div>
        <div class="logout-actions">
          <a class="btn btn-primary" href="/">Sign in again</a>
        </div>
        <div class="logout-note">
          <i class="bi bi-lock"></i>
          <span>For shared computers, close the browser tab after signing out.</span>
        </div>
      </div>
    </section>
  </body>
</html>
