<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Doctor Dashboard')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Doctor dashboard', 'Patient serial, feedback, and schedule', 'bi-person-vcard')}"></div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-people"></i></div>
            <span>Patients in Queue</span>
            <strong th:text="${data.metrics.patientsInQueue}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-calendar3"></i></div>
            <span>Scheduled Visits</span>
            <strong th:text="${data.metrics.todayAppointments}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-star"></i></div>
            <span>Average Rating</span>
            <strong th:text="${data.metrics.averageRating}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-chat-left-text"></i></div>
            <span>Total Reviews</span>
            <strong th:text="${data.metrics.totalReviews}">0</strong>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Queue</p>
                <h2 class="h6 fw-bold mb-0">Patient Serial</h2>
              </div>
            </div>
            <div class="data-list">
              <div class="data-row" th:each="entry, stat : ${data.patientSerial}">
                <div>
                  <strong th:text="'#' + ${stat.count} + ' ' + ${entry.patientName}">Patient</strong>
                  <span th:text="${entry.reason}">Reason</span>
                </div>
                <span class="badge text-bg-warning text-capitalize" th:text="${entry.status}">pending</span>
              </div>
              <p class="text-secondary small mb-0" th:if="${#lists.isEmpty(data.patientSerial)}">No patients in queue.</p>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Reviews</p>
                <h2 class="h6 fw-bold mb-0">Feedback</h2>
              </div>
            </div>
            <div class="data-list">
              <div class="data-row" th:each="review : ${data.feedback}">
                <div>
                  <strong th:text="${review.reviewerName}">Patient</strong>
                  <span th:text="${review.comment}">Comment</span>
                </div>
                <span class="badge text-bg-success" th:text="${review.score} + '/5'">5/5</span>
              </div>
              <p class="text-secondary small mb-0" th:if="${#lists.isEmpty(data.feedback)}">No feedback yet.</p>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Calendar</p>
                <h2 class="h6 fw-bold mb-0">Schedule</h2>
              </div>
            </div>
            <div class="data-list">
              <div class="data-row" th:each="slot : ${data.schedule}">
                <div>
                  <strong th:text="${slot.patientName}">Patient</strong>
                  <span th:text="${slot.scheduledAt}">Time</span>
                </div>
                <span class="badge text-bg-primary text-capitalize" th:text="${slot.status}">confirmed</span>
              </div>
              <p class="text-secondary small mb-0" th:if="${#lists.isEmpty(data.schedule)}">No appointments scheduled.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
