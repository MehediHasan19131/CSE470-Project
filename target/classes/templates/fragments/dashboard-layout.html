<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(pageTitle)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | SmartCare'">Dashboard | SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>

  <body>
    <a th:fragment="brand-logo(link)" th:href="${link}" class="brand-logo" aria-label="SmartCare home">
      <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="200" height="46">
    </a>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a href="/dashboard" class="brand-logo" aria-label="SmartCare home">
          <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="200" height="46">
        </a>
        <div class="d-flex align-items-center gap-3">
          <a href="/doctors" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-person-badge"></i> Doctors
          </a>
          <a href="/pharmacy-store" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-capsule"></i> Pharmacy
          </a>
          <span class="badge text-bg-primary text-capitalize" th:text="${#strings.toLowerCase(user.role)}">role</span>
          <span class="small text-secondary" th:text="${user.fullName}">User</span>
          <form method="post" action="/logout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
          </form>
        </div>
      </div>
    </nav>

    <div th:fragment="page-heading(label, subtitle, icon)" class="dashboard-hero">
      <div>
        <p class="text-uppercase text-primary small fw-semibold mb-1" th:text="${label}">Dashboard</p>
        <h1 class="h3 fw-bold mb-2" th:text="${label}">Dashboard</h1>
        <p class="mb-0" th:text="${subtitle}">Subtitle</p>
      </div>
      <div class="hero-graphic" aria-hidden="true">
        <div class="pulse-ring"></div>
        <i th:class="'bi ' + ${icon}"></i>
      </div>
    </div>
  </body>
</html>
