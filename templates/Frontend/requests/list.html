<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/dashboard-layout :: head('Blood Requests')}"></head>
<body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
        <div th:replace="~{fragments/dashboard-layout :: page-heading('Blood Requests', 'Open requests for blood donations', 'bi-heart-pulse')}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-secondary small">Open requests: <span class="badge bg-primary rounded-pill" th:text="${requests.size()}">0</span></span>
            <a class="btn btn-primary" href="/blood/requests/new">
                <i class="bi bi-plus-lg"></i> Create New Request
            </a>
        </div>

        <div class="donor-grid">
            <div class="donor-card" th:each="req : ${requests}">
                <div class="donor-header">
                    <span class="request-title" th:text="${req.requesterName}">Requester</span>
<span class="urgency-badge"
                      th:classappend="${req.urgency.name() == 'CRITICAL' ? 'text-bg-danger' : req.urgency.name() == 'HIGH' ? 'text-bg-warning text-dark' : req.urgency.name() == 'MEDIUM' ? 'text-bg-secondary' : 'text-bg-light'}"
                      th:text="${req.urgency}">CRITICAL</span>
                </div>

                <div class="donor-meta">
                    <i class="bi bi-droplet" style="color: var(--cyan);"></i>
                    <span th:text="${req.unitsNeeded}">2</span> units needed
                    <span class="d-block small text-muted mt-1">Blood group: <span th:text="${req.bloodGroupNeeded}" style="color: var(--cyan);">${req.bloodGroupNeeded}</span></span>
                    <span class="d-block small text-muted mt-1">Hospital/Location: <span th:text="${req.hospitalOrLocation}">Nearest hospital</span></span>
                    <span class="d-block small text-muted mt-1">Needed by: <span th:text="${#temporals.format(req.neededByDate, 'dd MMM yyyy')}">N/A</span></span>
                </div>

                <div class="donor-actions">
                    <button class="btn btn-sm btn-outline-primary"
                            th:onclick="'viewDonors(' + ${req.id} + ')'" title="View Matching Donors">
                        <i class="bi bi-search"></i> View Matching Donors
                    </button>
                </div>
            </div>
        </div>

        <div class="panel text-center py-5" th:unless="${!#lists.isEmpty(requests)}">
            <i class="bi bi-heart-pulse fs-1 text-secondary"></i>
            <p class="mt-3 mb-0 text-secondary">No open blood requests at this time.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
