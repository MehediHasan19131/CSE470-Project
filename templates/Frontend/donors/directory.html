<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/dashboard-layout :: head('Donor Directory')}"></head>
<body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
        <div th:replace="~{fragments/dashboard-layout :: page-heading('Donor Directory', 'Find available blood donors', 'bi-search')}"></div>

        <div class="row mb-4">
            <div class="col-lg-4">
                <div class="input-group">
                    <select class="form-select" id="bloodGroupFilter" aria-label="Blood group filter">
                        <option value="">All blood groups</option>
                        <option value="A+" th:selected="${bloodGroup == 'A+'}">A+</option>
                        <option value="A-" th:selected="${bloodGroup == 'A-'}">A-</option>
                        <option value="B+" th:selected="${bloodGroup == 'B+'}">B+</option>
                        <option value="B-" th:selected="${bloodGroup == 'B-'}">B-</option>
                        <option value="AB+" th:selected="${bloodGroup == 'AB+'}">AB+</option>
                        <option value="AB-" th:selected="${bloodGroup == 'AB-'}">AB-</option>
                        <option value="O+" th:selected="${bloodGroup == 'O+'}">O+</option>
                        <option value="O-" th:selected="${bloodGroup == 'O-'}">O-</option>
                    </select>
                    <input type="text" class="form-control" id="cityFilter"
                           placeholder="Filter by city..." th:value="${city}">
                    <button class="btn btn-outline-primary" onclick="filterDonors()">
                        <i class="bi bi-filter"></i> Filter
                    </button>
                </div>
            </div>
            <div class="col-lg-2">
                <button class="btn btn-primary w-100" onclick="window.location.href='/blood/donors/new'">
                    <i class="bi bi-person-plus"></i> Register Donor
                </button>
            </div>
        </div>

        <div class="donor-grid">
            <div class="donor-card" th:each="d : ${donors}">
                <div class="donor-header">
                    <span class="donor-name" th:text="${d.fullName}">Name</span>
                    <span class="donor-blood" th:classappend="${#strings.toLowerCase(d.bloodGroup) == 'o+'} ' : ''"
                          th:text="${d.bloodGroup}">A+</span>
                </div>
                <div class="donor-meta">
                    <i class="bi bi-phone"></i> <span th:text="${d.phone}">+880-17xxxxxxxx</span>
                    <i class="bi bi-geo-alt"></i> <span th:text="${d.city}">City</span>
                    <i class="bi bi-calendar"></i> <span th:text="${#temporals.format(d.lastDonationDate, 'dd MMM yyyy')}">Never</span>
                </div>
                <div class="donor-actions">
                    <span class="donor-available" th:classappend="${d.isAvailable} ? 'available' : 'unavailable'">
                        <i class="bi" th:class="${d.isAvailable} ? 'bi-check-circle' : 'bi-x-circle'"></i>
                        <span th:text="${d.isAvailable} ? 'Available' : 'Not Available'">Available</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="panel text-center py-5" th:if="${#lists.isEmpty(donors)}">
            <i class="bi bi-emergency fs-1 text-secondary"></i>
            <p class="mt-3 mb-0 text-secondary">No donors match your criteria.</p>
            <p class="text-secondary small mt-1">Try adjusting your blood group or city filters.</p>
            <a class="btn btn-primary" href="/blood/donors/new">Register a new donor</a>
        </div>
    </main>

    <script>
    function filterDonors() {
        const bg = document.getElementById('bloodGroupFilter').value;
        const city = document.getElementById('cityFilter').value;
        window.location.href = '/blood/donors?bloodGroup=' + bg + '&city=' + city;
    }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
