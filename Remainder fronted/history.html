<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/dashboard-layout :: head('Medicine History')}">
    <meta charset="UTF-8">
    <title>SmartCare</title>
</head>
<body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
        <div th:replace="~{fragments/dashboard-layout :: page-heading('Medicine History', 'Every dose you have logged, most recent first', 'bi-clock-history')}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-secondary small">Total logs: <span class="badge bg-primary rounded-pill" th:text="${logs.size()}">0</span></span>
            <a class="btn btn-outline-primary" href="/reminders">
                <i class="bi bi-arrow-left"></i> Back to Reminders
            </a>
        </div>

        <div class="panel p-0" th:unless="${#lists.isEmpty(logs)}">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Medicine</th>
                            <th>Dosage</th>
                            <th>Scheduled Time</th>
                            <th>Status</th>
                            <th>Logged At</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="l : ${logs}">
                            <td class="fw-semibold" th:text="${l.reminder.medicineName}">Medicine</td>
                            <td th:text="${l.reminder.dosage}">Dosage</td>
                            <td th:text="${l.scheduledTime}">08:00</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${l.status.name() == 'TAKEN' ? 'text-bg-success' : l.status.name() == 'MISSED' ? 'text-bg-danger' : 'text-bg-secondary'}"
                                      th:text="${l.status}">TAKEN</span>
                            </td>
                            <td th:text="${#temporals.format(l.loggedAt, 'dd MMM yyyy, hh:mm a')}">Date</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel text-center py-5" th:if="${#lists.isEmpty(logs)}">
            <i class="bi bi-clock-history fs-1 text-secondary"></i>
            <p class="mt-3 mb-0 text-secondary">No medicine history yet.</p>
            <p class="text-secondary small mt-1">Mark a dose as taken or missed to start your history.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
