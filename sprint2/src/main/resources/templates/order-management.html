<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Order Management')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Manage medicine orders', 'Confirm, dispatch, and deliver incoming pharmacy orders', 'bi-capsule')}"></div>

      <div class="panel">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">Queue</p>
            <h2 class="h6 fw-bold mb-0">Incoming orders</h2>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
        <div class="data-list" id="orderList">
          <div class="data-row"><span class="text-secondary">Loading…</span></div>
        </div>
      </div>
    </main>

    <script>
      async function loadOrders() {
        const list = document.getElementById('orderList');
        const res = await fetch('/api/medicine-orders/pharmacy', { credentials: 'same-origin' });
        const items = await res.json();
        if (!items.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">No orders yet.</span></div>';
          return;
        }
        list.innerHTML = items.map(o => `
          <div class="data-row">
            <div>
              <strong>${o.patientName}</strong>
              <span>${o.items.map(i => i.medicineName + ' ×' + i.quantity).join(', ')} · ৳${o.totalAmount}</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge text-bg-light">${o.status}</span>
              ${actions(o)}
            </div>
          </div>
        `).join('');
      }

      function actions(o) {
        if (o.status === 'PENDING') return button(o.id, 'CONFIRMED', 'Confirm') + ' ' + button(o.id, 'CANCELLED', 'Cancel', 'outline-danger');
        if (o.status === 'CONFIRMED') return button(o.id, 'OUT_FOR_DELIVERY', 'Dispatch');
        if (o.status === 'OUT_FOR_DELIVERY') return button(o.id, 'DELIVERED', 'Mark delivered');
        return '';
      }

      function button(id, status, label, variant) {
        return `<button class="btn btn-sm btn-${variant || 'primary'}" onclick="updateStatus(${id}, '${status}')">${label}</button>`;
      }

      async function updateStatus(id, status) {
        await fetch(`/api/medicine-orders/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ status })
        });
        loadOrders();
      }

      document.getElementById('refreshBtn').addEventListener('click', loadOrders);
      loadOrders();
    </script>
  </body>
</html>
