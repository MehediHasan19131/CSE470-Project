<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Medicine Ordering')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Order medicine', 'Browse a pharmacy catalog, add to cart, and place an order', 'bi-capsule')}"></div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Step 1</p>
                <h2 class="h6 fw-bold mb-0">Choose a pharmacy</h2>
              </div>
            </div>
            <div class="data-list" id="pharmacyList">
              <div class="data-row"><span class="text-secondary">Loading…</span></div>
            </div>
          </div>

          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">History</p>
                <h2 class="h6 fw-bold mb-0">My orders</h2>
              </div>
            </div>
            <div class="data-list" id="myOrders">
              <div class="data-row"><span class="text-secondary">Loading…</span></div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Step 2</p>
                <h2 class="h6 fw-bold mb-0" id="pharmacyLabel">Medicine catalog</h2>
              </div>
            </div>
            <div class="data-list" id="medicineList">
              <div class="data-row"><span class="text-secondary">Select a pharmacy first.</span></div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Step 3</p>
                <h2 class="h6 fw-bold mb-0">Your cart</h2>
              </div>
            </div>
            <div class="data-list mb-3" id="cartList">
              <div class="data-row"><span class="text-secondary">Cart is empty.</span></div>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <strong>Total</strong>
              <strong id="cartTotal">৳0.00</strong>
            </div>
            <div class="mb-3">
              <label class="form-label">Delivery address</label>
              <input type="text" class="form-control" id="deliveryAddress" placeholder="Where should we deliver?">
            </div>
            <div class="alert alert-danger py-2 d-none" id="orderError"></div>
            <button type="button" class="btn btn-primary w-100" id="placeOrderBtn">Place order</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      let selectedPharmacyId = null;
      let selectedPharmacyName = '';
      let cart = {}; // medicineId -> { medicine, quantity }

      async function loadPharmacies() {
        const list = document.getElementById('pharmacyList');
        const res = await fetch('/api/pharmacies', { credentials: 'same-origin' });
        const items = await res.json();
        if (!items.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">No pharmacies found.</span></div>';
          return;
        }
        list.innerHTML = items.map(p => `
          <div class="data-row">
            <div><strong>${p.name}</strong><span>${p.city || ''} · ★ ${p.averageRating}</span></div>
            <button class="btn btn-outline-primary btn-sm" onclick="selectPharmacy(${p.id}, '${p.name.replace(/'/g, "\\'")}')">Select</button>
          </div>
        `).join('');
      }

      async function selectPharmacy(id, name) {
        selectedPharmacyId = id;
        selectedPharmacyName = name;
        cart = {};
        renderCart();
        document.getElementById('pharmacyLabel').textContent = `Catalog · ${name}`;
        const res = await fetch('/api/medicines', { credentials: 'same-origin' });
        const items = await res.json();
        const list = document.getElementById('medicineList');
        list.innerHTML = items.map(m => `
          <div class="data-row">
            <div>
              <strong>${m.name}</strong>
              <span>৳${m.price} · ${m.inStock ? m.stockQuantity + ' in stock' : 'Out of stock'}</span>
            </div>
            <button class="btn btn-outline-primary btn-sm" ${m.inStock ? '' : 'disabled'} onclick='addToCart(${JSON.stringify(m)})'>Add</button>
          </div>
        `).join('');
      }

      function addToCart(medicine) {
        if (!cart[medicine.id]) {
          cart[medicine.id] = { medicine, quantity: 0 };
        }
        cart[medicine.id].quantity += 1;
        renderCart();
      }

      function changeQuantity(medicineId, delta) {
        if (!cart[medicineId]) return;
        cart[medicineId].quantity += delta;
        if (cart[medicineId].quantity <= 0) delete cart[medicineId];
        renderCart();
      }

      function renderCart() {
        const list = document.getElementById('cartList');
        const entries = Object.values(cart);
        if (!entries.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">Cart is empty.</span></div>';
          document.getElementById('cartTotal').textContent = '৳0.00';
          return;
        }
        let total = 0;
        list.innerHTML = entries.map(e => {
          const lineTotal = e.medicine.price * e.quantity;
          total += lineTotal;
          return `
            <div class="data-row">
              <div><strong>${e.medicine.name}</strong><span>৳${e.medicine.price} × ${e.quantity} = ৳${lineTotal.toFixed(2)}</span></div>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" onclick="changeQuantity(${e.medicine.id}, -1)">-</button>
                <button class="btn btn-outline-secondary" onclick="changeQuantity(${e.medicine.id}, 1)">+</button>
              </div>
            </div>
          `;
        }).join('');
        document.getElementById('cartTotal').textContent = `৳${total.toFixed(2)}`;
      }

      document.getElementById('placeOrderBtn').addEventListener('click', async () => {
        const errorBox = document.getElementById('orderError');
        errorBox.classList.add('d-none');
        if (!selectedPharmacyId) {
          errorBox.textContent = 'Please select a pharmacy first.';
          errorBox.classList.remove('d-none');
          return;
        }
        const items = Object.values(cart).map(e => ({ medicineId: e.medicine.id, quantity: e.quantity }));
        if (!items.length) {
          errorBox.textContent = 'Your cart is empty.';
          errorBox.classList.remove('d-none');
          return;
        }
        try {
          const res = await fetch('/api/medicine-orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              pharmacyId: selectedPharmacyId,
              items,
              deliveryAddress: document.getElementById('deliveryAddress').value
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || 'Could not place the order.');
          }
          cart = {};
          renderCart();
          loadOrders();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.remove('d-none');
        }
      });

      async function loadOrders() {
        const list = document.getElementById('myOrders');
        const res = await fetch('/api/medicine-orders/me', { credentials: 'same-origin' });
        const items = await res.json();
        if (!items.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">No orders yet.</span></div>';
          return;
        }
        list.innerHTML = items.map(o => `
          <div class="data-row">
            <div><strong>${o.pharmacyName}</strong><span>৳${o.totalAmount} · ${new Date(o.createdAt).toLocaleDateString()}</span></div>
            <span class="badge text-bg-light">${o.status}</span>
          </div>
        `).join('');
      }

      loadPharmacies();
      loadOrders();
    </script>
  </body>
</html>
