<!-- SPRINT 2 MERGE NOTE: this file REPLACES src/main/resources/templates/dashboard-patient.html.
     The Sprint 1 "Planned Integrations / Pending" placeholder list is replaced with working
     quick-action links to the 4 Sprint 2 features. -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Patient Dashboard')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Patient dashboard', 'Your care hub — book care, order medicine, and track your ambulance', 'bi-heart-pulse')}"></div>

      <div class="sprint-badge mb-4">
        <i class="bi bi-info-circle"></i>
        <span>Sprint 2: Appointment Booking, Reviews, Medicine Ordering, and Ambulance Booking are now live.</span>
      </div>

      <div class="panel">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">Quick actions</p>
            <h2 class="h6 fw-bold mb-0">Sprint 2 features</h2>
          </div>
        </div>
        <div class="action-grid">
          <a href="/appointments/book" class="action-tile">
            <i class="bi bi-calendar2-check"></i>
            <span>Book an appointment</span>
          </a>
          <a href="/ambulance/book" class="action-tile">
            <i class="bi bi-truck-front"></i>
            <span>Book an ambulance</span>
          </a>
          <a href="/medicines/order" class="action-tile">
            <i class="bi bi-capsule"></i>
            <span>Order medicine</span>
          </a>
          <a href="/reviews" class="action-tile">
            <i class="bi bi-star-half"></i>
            <span>Rate &amp; review</span>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
