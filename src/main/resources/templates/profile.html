<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a href="/profile" class="brand-logo" aria-label="SmartCare home">
          <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="200" height="46">
        </a>
        <div class="d-flex align-items-center gap-3">
          <span class="badge text-bg-primary text-capitalize" th:text="${#strings.toLowerCase(user.role)}">role</span>
          <span class="small text-secondary" th:text="${user.fullName}">User</span>
          <form method="post" action="/logout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container-fluid p-4">
      <div class="dashboard-hero mb-4">
        <div>
          <p class="text-uppercase text-primary small fw-semibold mb-1">My profile</p>
          <h1 class="h3 fw-bold mb-2">My profile</h1>
          <p class="mb-0">View and update your account details</p>
        </div>
        <div class="hero-graphic" aria-hidden="true">
          <div class="pulse-ring"></div>
          <i class="bi bi-person-circle"></i>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Account</p>
                <h2 class="h6 fw-bold mb-0">Your details</h2>
              </div>
            </div>

            <div class="alert alert-success py-2" th:if="${updated}">Profile updated.</div>

            <form method="post" action="/profile" class="vstack gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <div>
                <label class="form-label">Full name</label>
                <input class="form-control" type="text" name="fullName" th:value="${user.fullName}" required>
              </div>

              <div>
                <label class="form-label">Email</label>
                <input class="form-control" type="email" th:value="${user.email}" disabled>
                <div class="form-text">Email can't be changed here.</div>
              </div>

              <div>
                <label class="form-label">Phone</label>
                <input class="form-control" type="text" name="phone" th:value="${user.phone}" placeholder="+8801XXXXXXXXX">
              </div>

              <div>
                <label class="form-label">Role</label>
                <input class="form-control text-capitalize" type="text" th:value="${#strings.toLowerCase(user.role)}" disabled>
              </div>

              <button class="btn btn-primary" type="submit" style="width:fit-content; padding-left:28px; padding-right:28px;">
                Save changes
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Status</p>
                <h2 class="h6 fw-bold mb-0">Account status</h2>
              </div>
            </div>
            <p class="mb-2">
              <span class="badge text-bg-success" th:if="${user.active}">Active</span>
              <span class="badge text-bg-secondary" th:unless="${user.active}">Inactive</span>
            </p>
            <p class="text-secondary small mb-0">
              Member since <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">date</span>.
            </p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
