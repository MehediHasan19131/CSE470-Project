<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('My Profile')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('My profile', 'View and update your account details', 'bi-person-circle')}"></div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Account</p>
                <h2 class="h6 fw-bold mb-0">Your details</h2>
              </div>
            </div>

            <div class="alert alert-success py-2" th:if="${updated}">Profile updated.</div>

            <form method="post" action="/profile" class="vstack gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <div>
                <label class="form-label">Full name</label>
                <input class="form-control" type="text" name="fullName" th:value="${user.fullName}" required>
              </div>

              <div>
                <label class="form-label">Email</label>
                <input class="form-control" type="email" th:value="${user.email}" disabled>
                <div class="form-text">Email can't be changed here.</div>
              </div>

              <div>
                <label class="form-label">Phone</label>
                <input class="form-control" type="text" name="phone" th:value="${user.phone}" placeholder="+8801XXXXXXXXX">
              </div>

              <div>
                <label class="form-label">Role</label>
                <input class="form-control text-capitalize" type="text" th:value="${#strings.toLowerCase(user.role)}" disabled>
              </div>

              <button class="btn btn-primary" type="submit" style="width:fit-content; padding-left:28px; padding-right:28px;">
                Save changes
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Status</p>
                <h2 class="h6 fw-bold mb-0">Account status</h2>
              </div>
            </div>
            <p class="mb-2">
              <span class="badge text-bg-success" th:if="${user.active}">Active</span>
              <span class="badge text-bg-secondary" th:unless="${user.active}">Inactive</span>
            </p>
            <p class="text-secondary small mb-0">
              Member since <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">date</span>.
            </p>
            <a href="/dashboard" class="btn btn-outline-secondary btn-sm mt-3">
              <i class="bi bi-arrow-left"></i> Back to dashboard
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
