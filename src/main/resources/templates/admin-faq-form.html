<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head(${title})}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>
    <main class="container" style="max-width: 850px;">
      <div class="page-heading mt-4"><div><p class="text-uppercase text-primary small fw-semibold mb-1"><i class="bi bi-question-circle"></i> Help centre</p><h1 class="h4 fw-bold mb-0" th:text="${title}">Create FAQ</h1></div></div>
      <form class="panel" method="post" th:action="${formAction}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3"><label class="form-label fw-semibold" for="question">Question</label><input class="form-control" id="question" name="question" maxlength="300" required th:value="${formQuestion}"></div>
        <div class="mb-3"><label class="form-label fw-semibold" for="answer">Answer</label><textarea class="form-control" id="answer" name="answer" rows="7" required th:text="${formAnswer}"></textarea></div>
        <div class="row align-items-end g-3"><div class="col-sm-4"><label class="form-label fw-semibold" for="displayOrder">Display order</label><input class="form-control" id="displayOrder" name="displayOrder" type="number" min="0" required th:value="${formDisplayOrder}"></div><div class="col-sm-8"><div class="form-check mb-2"><input class="form-check-input" id="published" name="published" type="checkbox" th:checked="${formPublished}"><label class="form-check-label" for="published">Publish this FAQ publicly</label></div></div></div>
        <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Save FAQ</button><a class="btn btn-outline-secondary" href="/admin/faqs">Cancel</a></div>
      </form>
    </main>
  </body>
</html>
