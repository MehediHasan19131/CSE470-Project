<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a href="/profile" class="brand-logo" aria-label="SmartCare home">
          <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="200" height="46">
        </a>
        <div class="d-flex align-items-center gap-3">
          <a href="/reviews" class="btn btn-outline-primary btn-sm"><i class="bi bi-star"></i> Providers &amp; Reviews</a>
          <a href="/profile" class="btn btn-outline-secondary btn-sm">My profile</a>
        </div>
      </div>
    </nav>

    <main class="container-fluid p-4">
      <div class="dashboard-hero mb-4">
        <div>
          <p class="text-uppercase text-primary small fw-semibold mb-1">Admin</p>
          <h1 class="h3 fw-bold mb-2">Admin dashboard</h1>
          <p class="mb-0">Full visibility across every account and every provider's rating.</p>
        </div>
        <div class="hero-graphic" aria-hidden="true">
          <div class="pulse-ring"></div>
          <i class="bi bi-speedometer2"></i>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-4">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Users</p>
                <h2 class="h6 fw-bold mb-0">Accounts by role</h2>
              </div>
            </div>
            <p class="mb-3"><strong class="fs-3" th:text="${totalUsers}">0</strong> <span class="text-secondary">total accounts</span></p>
            <div class="vstack gap-2">
              <div class="d-flex justify-content-between" th:each="r : ${roles}">
                <span class="text-capitalize" th:text="${#strings.toLowerCase(r)}">role</span>
                <span class="badge text-bg-light" th:text="${roleCounts.get(r)} ?: 0">0</span>
              </div>
            </div>
            <a href="/admin/users" class="btn btn-primary btn-sm mt-3"><i class="bi bi-people"></i> Manage users</a>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Reviews &amp; ratings</p>
                <h2 class="h6 fw-bold mb-0">Every provider's current rating</h2>
              </div>
            </div>
            <p class="text-secondary small mb-0" th:if="${#lists.isEmpty(providers)}">No providers registered yet.</p>
            <div class="provider-grid" th:unless="${#lists.isEmpty(providers)}">
              <a class="provider-card text-decoration-none" th:each="provider : ${providers}" th:href="@{'/reviews/' + ${provider.id}}">
                <span class="badge text-bg-light text-capitalize" style="width:fit-content;" th:text="${#strings.toLowerCase(provider.role)}">role</span>
                <strong class="text-dark" th:text="${provider.fullName}">Provider name</strong>
                <div class="provider-card-rating">
                  <span class="star-display" aria-hidden="true">
                    <i th:each="i : ${#numbers.sequence(1,5)}"
                       th:class="${i <= T(java.lang.Math).round(provider.averageRating)} ? 'bi bi-star-fill' : 'bi bi-star'"></i>
                  </span>
                  <span th:text="${#numbers.formatDecimal(provider.averageRating, 1, 1)} + ' (' + ${provider.totalReviews} + ')'">0.0 (0)</span>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
