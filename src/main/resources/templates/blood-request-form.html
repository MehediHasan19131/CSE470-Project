<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/dashboard-layout :: head('Create Blood Request')}"></head><body><nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav><main class="container" style="max-width:760px"><div class="page-heading mt-4"><div><p class="text-uppercase text-primary small fw-semibold mb-1">Blood donation</p><h1 class="h4 fw-bold">Create a blood request</h1></div></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form class="panel vstack gap-3" method="post" action="/blood/requests"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Requester name</label><input class="form-control" name="requesterName" required th:value="${defaultName}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="requesterPhone" required th:value="${defaultPhone}"></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Blood group needed</label><select class="form-select" name="bloodGroup" required><option th:each="group : ${bloodGroups}" th:value="${group}" th:text="${group}"></option></select></div><div class="col-md-6"><label class="form-label">Units needed</label><input class="form-control" type="number" name="units" min="1" required></div></div><div><label class="form-label">Hospital or location</label><input class="form-control" name="location" required></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Urgency</label><select class="form-select" name="urgency"><option th:each="urgency : ${urgencies}" th:value="${urgency}" th:text="${urgency}"></option></select></div><div class="col-md-6"><label class="form-label">Needed by</label><input class="form-control" type="date" name="neededBy" th:min="${today}" th:value="${today}" required></div></div><div><button class="btn btn-primary">Create request</button><a class="btn btn-outline-secondary ms-2" href="/blood/requests">Cancel</a></div></form></main></body></html>
