<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/dashboard-layout :: head('Blood Requests')}"></head><body><nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav><main class="container-fluid p-4"><div th:replace="~{fragments/dashboard-layout :: page-heading('Blood Requests', 'Open requests for urgently needed blood', 'bi-heart-pulse')}"></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="d-flex justify-content-end mb-3"><a class="btn btn-primary" href="/blood/requests/new"><i class="bi bi-plus-lg"></i> Create request</a></div><div class="row g-3" th:if="${!#lists.isEmpty(requests)}"><div class="col-md-6 col-xl-4" th:each="request : ${requests}"><a class="panel h-100 d-block text-decoration-none text-dark" th:href="@{'/blood/requests/' + ${request.id}}"><div class="d-flex justify-content-between"><strong th:text="${request.bloodGroupNeeded + ' blood needed'}">A+ blood needed</strong><span class="badge text-bg-danger" th:text="${request.urgency}">HIGH</span></div><p class="mb-1 mt-3" th:text="${request.unitsNeeded + ' unit(s) · ' + request.hospitalOrLocation}">Units</p><small class="text-secondary" th:text="${'Needed by ' + request.neededByDate}">Date</small></a></div></div><div class="panel text-center py-5" th:if="${#lists.isEmpty(requests)}">No open blood requests right now.</div></main></body></html>
