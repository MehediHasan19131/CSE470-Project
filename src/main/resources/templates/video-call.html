<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Consultation | SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body th:attr="data-consultation-id=${consultationId}">
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Video consultation', 'Telemedicine call powered by Jitsi Meet — Member 3 (Telemedicine)', 'bi-camera-video')}"></div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="panel p-0" style="overflow:hidden;">
            <div id="jitsiContainer" style="height:560px;background:#0e1b21;"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="badge text-bg-light" id="callStatusBadge">Connecting…</span>
            <button type="button" class="btn btn-outline-danger btn-sm" id="endCallBtn">
              <i class="bi bi-telephone-x"></i> End call
            </button>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Consultation</p>
                <h2 class="h6 fw-bold mb-0" id="consultationTitle">Loading…</h2>
              </div>
            </div>
            <div class="info-grid">
              <div><span>Scheduled</span><strong id="scheduledAt">—</strong></div>
              <div><span>Status</span><strong id="statusText">—</strong></div>
            </div>
          </div>

          <div class="panel d-none" id="notesPanel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Consultation record</p>
                <h2 class="h6 fw-bold mb-0" id="notesTitle">Notes &amp; prescription</h2>
              </div>
            </div>
            <form id="notesForm" class="vstack gap-3">
              <div>
                <label class="form-label">Doctor's notes</label>
                <textarea class="form-control" id="notesInput" rows="4" placeholder="Consultation summary"></textarea>
              </div>
              <div>
                <label class="form-label">Prescription</label>
                <textarea class="form-control" id="prescriptionInput" rows="4" placeholder="Medicines and instructions"></textarea>
              </div>
              <div class="alert alert-success py-2 d-none" id="notesSaved">Saved.</div>
              <button type="submit" class="btn btn-primary btn-sm align-self-start">Save consultation record</button>
            </form>
          </div>

          <div class="panel d-none" id="notesViewPanel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Consultation record</p>
                <h2 class="h6 fw-bold mb-0">Doctor's notes &amp; prescription</h2>
              </div>
            </div>
            <p class="mb-2" id="notesView">—</p>
            <p class="mb-0 text-secondary" id="prescriptionView">—</p>
          </div>

          <a href="/telemedicine/history" class="btn btn-outline-secondary btn-sm w-100 mt-3">
            <i class="bi bi-clock-history"></i> Back to consultation history
          </a>
        </div>
      </div>
    </main>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
      const consultationId = document.body.dataset.consultationId;
      let currentUser = null;
      let consultation = null;
      let jitsiApi = null;

      async function init() {
        const [meRes, consultRes] = await Promise.all([
          fetch('/api/me', { credentials: 'same-origin' }),
          fetch(`/api/consultations/${consultationId}`, { credentials: 'same-origin' })
        ]);
        currentUser = await meRes.json();
        consultation = await consultRes.json();

        document.getElementById('consultationTitle').textContent =
          currentUser.role === 'DOCTOR' ? `With ${consultation.patientName}` : `With Dr. ${consultation.doctorName}`;
        document.getElementById('scheduledAt').textContent = new Date(consultation.scheduledAt).toLocaleString();
        document.getElementById('statusText').textContent = consultation.status;
        document.getElementById('callStatusBadge').textContent = consultation.status;

        if (currentUser.role === 'DOCTOR') {
          document.getElementById('notesPanel').classList.remove('d-none');
          document.getElementById('notesInput').value = consultation.notes || '';
          document.getElementById('prescriptionInput').value = consultation.prescription || '';
        } else if (consultation.notes || consultation.prescription) {
          document.getElementById('notesViewPanel').classList.remove('d-none');
          document.getElementById('notesView').textContent = consultation.notes || 'No notes yet.';
          document.getElementById('prescriptionView').textContent = consultation.prescription ? ('Prescription: ' + consultation.prescription) : '';
        }

        if (consultation.status === 'CANCELLED' || consultation.status === 'COMPLETED') {
          document.getElementById('jitsiContainer').innerHTML =
            '<div class="d-flex align-items-center justify-content-center h-100 text-white-50">This consultation has ended.</div>';
          document.getElementById('endCallBtn').disabled = true;
          return;
        }

        jitsiApi = new JitsiMeetExternalAPI('meet.jit.si', {
          roomName: consultation.roomName,
          parentNode: document.getElementById('jitsiContainer'),
          width: '100%',
          height: '100%',
          userInfo: { displayName: currentUser.fullName || (currentUser.role === 'DOCTOR' ? 'Doctor' : 'Patient') },
          configOverwrite: { prejoinPageEnabled: false },
          interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false }
        });

        jitsiApi.addListener('videoConferenceJoined', () => updateStatus('IN_PROGRESS'));
        jitsiApi.addListener('readyToClose', () => updateStatus('COMPLETED'));
        jitsiApi.addListener('videoConferenceLeft', () => updateStatus('COMPLETED'));
      }

      async function updateStatus(status) {
        try {
          const res = await fetch(`/api/consultations/${consultationId}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ status })
          });
          if (res.ok) {
            const updated = await res.json();
            document.getElementById('callStatusBadge').textContent = updated.status;
            document.getElementById('statusText').textContent = updated.status;
          }
        } catch (e) { /* best-effort status sync */ }
      }

      document.getElementById('endCallBtn').addEventListener('click', () => {
        if (jitsiApi) jitsiApi.executeCommand('hangup');
        updateStatus('COMPLETED');
      });

      document.getElementById('notesForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch(`/api/consultations/${consultationId}/notes`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            notes: document.getElementById('notesInput').value,
            prescription: document.getElementById('prescriptionInput').value
          })
        });
        if (res.ok) {
          const box = document.getElementById('notesSaved');
          box.classList.remove('d-none');
          setTimeout(() => box.classList.add('d-none'), 2500);
        }
      });

      init();
    </script>
  </body>
</html>
