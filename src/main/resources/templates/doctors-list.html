<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Doctor Directory')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Doctor directory', 'Browse every doctor registered on SmartCare', 'bi-person-badge')}"></div>

      <div class="d-flex justify-content-end mb-3">
        <a href="/doctors/search" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-search"></i> Search by Specialty
        </a>
      </div>

      <div class="row g-4" th:if="${#lists.size(doctors) > 0}">
        <div class="col-12 col-md-6 col-xl-4" th:each="doctor : ${doctors}">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1" th:text="${doctor.specialization} ?: 'General'">Specialty</p>
                <h2 class="h6 fw-bold mb-0" th:text="${doctor.fullName}">Dr. Name</h2>
              </div>
              <span class="badge text-bg-light" th:if="${doctor.totalReviews} > 0">
                <i class="bi bi-star-fill text-warning"></i> <span th:text="${doctor.averageRating}">0</span>
              </span>
            </div>

            <div class="data-list">
              <div class="data-row">
                <div>
                  <strong>Qualification</strong>
                  <span th:text="${doctor.qualification} ?: '—'">MBBS</span>
                </div>
              </div>
              <div class="data-row">
                <div>
                  <strong>Experience</strong>
                  <span th:text="${doctor.experienceYears} != null ? ${doctor.experienceYears} + ' years' : '—'">— </span>
                </div>
              </div>
              <div class="data-row">
                <div>
                  <strong>Consultation Fee</strong>
                  <span th:text="${doctor.consultationFee} != null ? '৳' + ${doctor.consultationFee} : '—'">—</span>
                </div>
                <span class="badge text-bg-light" th:text="${doctor.city} ?: '—'">City</span>
              </div>
            </div>

            <a th:href="@{'/doctors/' + ${doctor.id}}" class="btn btn-primary btn-sm w-100 mt-3">View Profile</a>
          </div>
        </div>
      </div>

      <div class="alert alert-warning" th:if="${#lists.size(doctors) == 0}">
        No doctors found yet. Create one via <code>POST /api/doctors</code>.
      </div>
    </main>
  </body>
</html>
