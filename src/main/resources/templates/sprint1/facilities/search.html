<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Search Facilities')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">

      <div th:replace="~{fragments/dashboard-layout :: page-heading('Search Facilities', 'Find hospitals, diagnostic centers, and pharmacies', 'bi-search')}"></div>

      <div class="panel mb-4">
        <form method="get" action="/facilities/search" class="search-controls">
          <div>
            <label class="form-label visually-hidden" for="query">Search by name</label>
            <input class="form-control" id="query" type="text" name="query" th:value="${query}" placeholder="Search by facility name...">
          </div>
          <div>
            <label class="form-label visually-hidden" for="location">Location</label>
            <input class="form-control" id="location" type="text" name="location" th:value="${location}" placeholder="City or location...">
          </div>
          <div>
            <label class="form-label visually-hidden" for="type">Type</label>
            <select class="form-select" id="type" name="type">
              <option value="ALL" th:selected="${selectedType == 'ALL'}">All Types</option>
              <option value="HOSPITAL" th:selected="${selectedType == 'HOSPITAL'}">Hospitals</option>
              <option value="DIAGNOSTIC" th:selected="${selectedType == 'DIAGNOSTIC'}">Diagnostic Centers</option>
              <option value="PHARMACY" th:selected="${selectedType == 'PHARMACY'}">Pharmacies</option>
            </select>
          </div>
          <div>
            <button class="btn btn-primary h-100 px-4" type="submit">
              <i class="bi bi-search"></i> Search
            </button>
          </div>
        </form>
      </div>

      <div class="mb-3" th:if="${query != null or location != null}">
        <span class="text-secondary" th:text="'Found ' + ${#lists.size(results)} + ' result(s)'">0 results</span>
      </div>

      <div class="facility-grid" th:if="${!#lists.isEmpty(results)}">
        <div class="facility-card" th:each="f : ${results}">
          <div class="facility-card-body">
            <div class="facility-card-header">
              <div>
                <span class="facility-card-type" th:classappend="${#strings.toLowerCase(f.role)}" th:text="${#strings.capitalize(#strings.toLowerCase(f.role))}">Type</span>
                <a class="facility-card-title d-block mt-1" th:href="@{/facilities/{type}/{id}(type=${#strings.toLowerCase(f.role)}, id=${f.id})}" th:text="${f.name}">Name</a>
              </div>
              <div class="facility-card-icon" th:classappend="${#strings.toLowerCase(f.role)}">
                <i class="bi" th:class="|bi-${f.role.name() == 'HOSPITAL' ? 'hospital' : f.role.name() == 'DIAGNOSTIC' ? 'microscope' : 'capsule'}|"></i>
              </div>
            </div>
            <div class="facility-card-meta">
              <span th:if="${f.city}"><i class="bi bi-geo-alt"></i> <span th:text="${f.city}">City</span></span>
              <span th:if="${f.address}"><i class="bi bi-pin-map"></i> <span th:text="${f.address}">Address</span></span>
              <span th:if="${f.serviceName}"><i class="bi bi-tag"></i> <span th:text="${f.serviceName}">Service</span></span>
            </div>
          </div>
          <div class="facility-card-footer">
            <div class="facility-rating" th:if="${f.totalReviews > 0}">
              <i class="bi bi-star-fill"></i>
              <span th:text="${f.averageRating}">0.0</span>
              <span class="muted" th:text="'(' + ${f.totalReviews} + ')'">(0)</span>
            </div>
            <div class="facility-rating" th:unless="${f.totalReviews > 0}">
              <span class="muted">No reviews yet</span>
            </div>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/facilities/{type}/{id}(type=${#strings.toLowerCase(f.role)}, id=${f.id})}">
              View Details <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="panel text-center py-5" th:unless="${!#lists.isEmpty(results)}">
        <i class="bi bi-search fs-1 text-secondary"></i>
        <p class="mt-3 mb-0 text-secondary" th:if="${query != null or location != null}">No facilities matched your search criteria.</p>
        <p class="mt-3 mb-0 text-secondary" th:unless="${query != null or location != null}">Enter a name or location above to search.</p>
      </div>

    </main>
  </body>
</html>
