<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'create'} ? 'Add User | SmartCare' : 'Edit User | SmartCare'">User | SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a href="/profile" class="brand-logo" aria-label="SmartCare home">
          <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="200" height="43">
        </a>
        <div class="d-flex align-items-center gap-3">
          <a href="/admin/users" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> All users</a>
        </div>
      </div>
    </nav>

    <main class="container-fluid p-4">
      <div class="dashboard-hero mb-4">
        <div>
          <p class="text-uppercase text-primary small fw-semibold mb-1">Admin</p>
          <h1 class="h3 fw-bold mb-2" th:text="${mode == 'create'} ? 'Add a new user' : 'Edit user'">User</h1>
        </div>
        <div class="hero-graphic" aria-hidden="true">
          <div class="pulse-ring"></div>
          <i class="bi bi-person-plus"></i>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-7">
          <div class="panel">
            <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}">Error</div>

            <form th:action="@{${formAction}}" method="post" class="vstack gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <div>
                <label class="form-label">Full name</label>
                <input class="form-control" type="text" name="fullName" placeholder="e.g. Nahian Mahmud" required th:value="${formFullName}">
              </div>

              <div>
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" placeholder="you@example.com" required th:value="${formEmail}">
              </div>

              <div>
                <label class="form-label" th:text="${mode == 'create'} ? 'Password' : 'New password (optional)'">Password</label>
                <input class="form-control" type="password" name="password" th:if="${mode == 'create'}" minlength="8" required>
                <input class="form-control" type="password" name="newPassword" th:unless="${mode == 'create'}" minlength="8" placeholder="Leave blank to keep the current password">
                <div class="form-text">At least 8 characters.</div>
              </div>

              <div>
                <label class="form-label">Phone</label>
                <input class="form-control" type="text" name="phone" placeholder="+8801XXXXXXXXX" th:value="${formPhone}">
              </div>

              <div>
                <label class="form-label">Role</label>
                <select class="form-select" name="role" required>
                  <option th:each="r : ${roles}" th:value="${r}" th:text="${#strings.toLowerCase(r)}"
                          th:selected="${formRole != null and formRole == r}">role</option>
                </select>
              </div>

              <div class="form-check" th:unless="${mode == 'create'}">
                <input class="form-check-input" type="checkbox" name="active" id="active" th:checked="${formActive}">
                <label class="form-check-label" for="active">Account is active (unchecked = user can't log in)</label>
              </div>

              <button class="btn btn-primary" type="submit" style="width:fit-content; padding-left:28px; padding-right:28px;">
                <span th:text="${mode == 'create'} ? 'Create user' : 'Save changes'">Save</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
