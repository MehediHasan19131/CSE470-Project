<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/dashboard-layout :: head('Blood Request')}"></head><body><nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav><main class="container-fluid p-4"><div th:replace="~{fragments/dashboard-layout :: page-heading('Blood Request', 'Request details and matching available donors', 'bi-droplet-fill')}"></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="row g-4"><section class="col-lg-4"><div class="panel"><div class="d-flex justify-content-between"><h2 class="h5">Request details</h2><span class="badge text-bg-danger" th:text="${request.status}">OPEN</span></div><dl class="row mb-0"><dt class="col-6">Blood group</dt><dd class="col-6" th:text="${request.bloodGroupNeeded}">A+</dd><dt class="col-6">Units</dt><dd class="col-6" th:text="${request.unitsNeeded}">1</dd><dt class="col-6">Urgency</dt><dd class="col-6" th:text="${request.urgency}">HIGH</dd><dt class="col-6">Location</dt><dd class="col-6" th:text="${request.hospitalOrLocation}">Hospital</dd><dt class="col-6">Needed by</dt><dd class="col-6" th:text="${request.neededByDate}">Date</dd></dl><form th:if="${request.status.name() == 'OPEN' and (request.requestedBy.id == user.id or user.role.name() == 'ADMIN')}" method="post" th:action="@{'/blood/requests/' + ${request.id} + '/fulfil'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-success" type="submit">Mark fulfilled</button></form></div></section><section class="col-lg-8"><div class="panel"><h2 class="h5">Matching available donors</h2><div class="row g-3" th:if="${!#lists.isEmpty(matchingDonors)}"><div class="col-md-6" th:each="donor : ${matchingDonors}"><div class="border rounded p-3"><strong th:text="${donor.fullName}">Donor</strong><span class="badge text-bg-danger float-end" th:text="${donor.bloodGroup}">A+</span><p class="text-secondary small mb-1 mt-2" th:text="${donor.city}">City</p><a th:href="${'tel:' + donor.phone}" th:text="${donor.phone}">Phone</a></div></div></div><p class="text-secondary mb-0" th:if="${#lists.isEmpty(matchingDonors)}">No available matching donors at the moment.</p></div></section></div><a class="btn btn-outline-secondary mt-4" href="/blood/requests">Back to requests</a></main></body></html>
