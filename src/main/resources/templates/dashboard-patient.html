<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Patient Dashboard')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Patient dashboard', 'Your care hub — Member 4 dashboard shell', 'bi-heart-pulse')}"></div>

      <div class="sprint-badge mb-4">
        <i class="bi bi-info-circle"></i>
        <span th:text="${data.integrationNote}">Integration note</span>
      </div>

      <div class="panel">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">Modules</p>
            <h2 class="h6 fw-bold mb-0">Planned Integrations</h2>
          </div>
        </div>
        <div class="data-list">
          <div class="data-row" th:each="module : ${data.modules}">
            <div>
              <strong th:text="${module}">Module</strong>
              <span>Owned by another sprint member</span>
            </div>
            <span class="badge text-bg-light">Pending</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
