<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Ratings & Reviews')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Ratings & reviews', 'Rate and review doctors, hospitals, pharmacies, and ambulance providers', 'bi-star-half')}"></div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Browse</p>
                <h2 class="h6 fw-bold mb-0">Choose a provider</h2>
              </div>
              <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-primary" data-type="doctor" onclick="setType(this)">Doctors</button>
                <button class="btn btn-outline-primary" data-type="hospital" onclick="setType(this)">Hospitals</button>
                <button class="btn btn-outline-primary" data-type="pharmacy" onclick="setType(this)">Pharmacies</button>
                <button class="btn btn-outline-primary" data-type="ambulance" onclick="setType(this)">Ambulance</button>
              </div>
            </div>
            <div class="data-list" id="providerList">
              <div class="data-row"><span class="text-secondary">Loading…</span></div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1" id="selectedProviderLabel">Select a provider</p>
                <h2 class="h6 fw-bold mb-0" id="selectedProviderName">—</h2>
              </div>
              <span class="badge text-bg-light" id="ratingSummaryBadge">— ★</span>
            </div>

            <form id="reviewForm" class="vstack gap-3 mb-4" style="display:none;">
              <div>
                <label class="form-label">Your rating</label>
                <select class="form-select" id="score">
                  <option value="5">5 — Excellent</option>
                  <option value="4">4 — Good</option>
                  <option value="3">3 — Average</option>
                  <option value="2">2 — Below average</option>
                  <option value="1">1 — Poor</option>
                </select>
              </div>
              <div>
                <label class="form-label">Comment</label>
                <textarea class="form-control" id="comment" rows="2" placeholder="Share your experience"></textarea>
              </div>
              <div class="alert alert-danger py-2 d-none" id="reviewError"></div>
              <button type="submit" class="btn btn-primary btn-sm align-self-start">Submit review</button>
            </form>

            <div class="data-list" id="reviewsList">
              <div class="data-row"><span class="text-secondary">Select a provider to see reviews.</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      let type = 'doctor';
      let selectedTargetId = null;

      function setType(btn) {
        type = btn.dataset.type;
        document.querySelectorAll('[data-type]').forEach(b => {
          b.classList.toggle('btn-primary', b === btn);
          b.classList.toggle('btn-outline-primary', b !== btn);
        });
        loadProviders();
      }

      async function loadProviders() {
        const list = document.getElementById('providerList');
        list.innerHTML = '<div class="data-row"><span class="text-secondary">Loading…</span></div>';
        let items = [];
        let mapped = [];
        try {
          if (type === 'doctor') {
            items = await (await fetch('/api/doctors/search', { credentials: 'same-origin' })).json();
            mapped = items.map(d => ({ id: d.id, name: d.name, sub: d.specialization || 'General', rating: d.averageRating, total: d.totalReviews }));
          } else if (type === 'hospital') {
            items = await (await fetch('/api/hospitals', { credentials: 'same-origin' })).json();
            mapped = items.map(d => ({ id: d.id, name: d.name, sub: d.city || '', rating: d.averageRating, total: d.totalReviews }));
          } else if (type === 'pharmacy') {
            items = await (await fetch('/api/pharmacies', { credentials: 'same-origin' })).json();
            mapped = items.map(d => ({ id: d.id, name: d.name, sub: d.city || '', rating: d.averageRating, total: d.totalReviews }));
          } else {
            items = await (await fetch('/api/ambulances', { credentials: 'same-origin' })).json();
            const seen = new Set();
            mapped = items.filter(a => {
              if (seen.has(a.providerId)) return false;
              seen.add(a.providerId);
              return true;
            }).map(a => ({ id: a.providerId, name: a.providerName, sub: `${a.vehicleNumber} fleet`, rating: null, total: null }));
          }
        } catch (e) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">Could not load providers.</span></div>';
          return;
        }
        if (!mapped.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">Nothing found.</span></div>';
          return;
        }
        list.innerHTML = mapped.map(p => `
          <div class="data-row">
            <div>
              <strong>${p.name}</strong>
              <span>${p.sub}${p.rating != null ? ' · ★ ' + p.rating + ' (' + p.total + ')' : ''}</span>
            </div>
            <button class="btn btn-outline-primary btn-sm" onclick="selectProvider(${p.id}, '${(p.name || '').replace(/'/g, "\\'")}')">View</button>
          </div>
        `).join('');
      }

      async function selectProvider(id, name) {
        selectedTargetId = id;
        document.getElementById('selectedProviderLabel').textContent = type.charAt(0).toUpperCase() + type.slice(1);
        document.getElementById('selectedProviderName').textContent = name;
        document.getElementById('reviewForm').style.display = 'flex';
        document.getElementById('reviewError').classList.add('d-none');
        await loadReviews();
      }

      async function loadReviews() {
        const box = document.getElementById('reviewsList');
        const badge = document.getElementById('ratingSummaryBadge');
        const res = await fetch(`/api/ratings/target/${selectedTargetId}`, { credentials: 'same-origin' });
        const summary = await res.json();
        badge.textContent = `${summary.averageScore} ★ (${summary.totalReviews})`;
        box.innerHTML = summary.reviews.length
          ? summary.reviews.map(r => `
              <div class="data-row">
                <div><strong>${r.reviewerName}</strong><span>${r.comment || 'No comment'}</span></div>
                <span class="badge text-bg-light">${r.score} ★</span>
              </div>
            `).join('')
          : '<div class="data-row"><span class="text-secondary">No reviews yet — be the first!</span></div>';
      }

      document.getElementById('reviewForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById('reviewError');
        errorBox.classList.add('d-none');
        try {
          const res = await fetch('/api/ratings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              targetUserId: selectedTargetId,
              score: Number(document.getElementById('score').value),
              comment: document.getElementById('comment').value
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || 'Could not submit review.');
          }
          document.getElementById('comment').value = '';
          loadReviews();
          loadProviders();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.remove('d-none');
        }
      });

      loadProviders();
    </script>
  </body>
</html>
