<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Review reports')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Reports &amp; messages', 'Contact messages and problem reports from users', 'bi-inbox')}"></div>

      <div class="alert alert-success py-2" th:if="${param.resolved}">Marked as resolved.</div>
      <div class="alert alert-danger py-2" th:if="${param.error != null}" th:text="${param.error[0]}">Error</div>

      <div class="panel">
        <p class="text-secondary mb-0" th:if="${#lists.isEmpty(messages)}">No messages yet.</p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(messages)}">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Type</th><th>From</th><th>Subject</th><th>Message</th><th>Date</th><th>Status</th><th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m : ${messages}">
                <td><span class="badge" th:classappend="${m.type == 'REPORT'} ? 'text-bg-warning' : 'text-bg-info'" th:text="${m.type}">TYPE</span></td>
                <td th:text="${m.sender != null ? m.sender.fullName : 'Unknown'}">name</td>
                <td th:text="${m.subject}">subject</td>
                <td style="max-width: 360px; white-space: normal;" th:text="${m.message}">message</td>
                <td th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy')}">date</td>
                <td><span class="badge" th:classappend="${m.status == 'OPEN'} ? 'text-bg-danger' : 'text-bg-success'" th:text="${m.status}">OPEN</span></td>
                <td class="text-end">
                  <form th:if="${m.status == 'OPEN'}" th:action="@{'/admin/reports/' + ${m.id} + '/resolve'}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-success btn-sm" type="submit"><i class="bi bi-check-lg"></i> Resolve</button>
                  </form>
                  <span class="text-secondary small" th:unless="${m.status == 'OPEN'}">—</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
