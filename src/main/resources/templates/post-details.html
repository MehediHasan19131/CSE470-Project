<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${post.title} + ' | SmartCare Blog'">Post | SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a href="/profile" class="brand-logo" aria-label="SmartCare home">
          <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="200" height="46">
        </a>
        <div class="d-flex align-items-center gap-3">
          <span class="badge text-bg-primary text-capitalize" th:text="${#strings.toLowerCase(me.role)}">role</span>
          <span class="small text-secondary" th:text="${me.fullName}">User</span>
          <form method="post" action="/logout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container-fluid p-4">
      <div class="page-heading">
        <a href="/blog" class="small text-secondary text-decoration-none"><i class="bi bi-arrow-left"></i> Back to blog feed</a>
      </div>

      <div class="panel mb-4">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">
              <span class="text-capitalize" th:text="${#strings.toLowerCase(post.authorRole)}">role</span> · <span th:text="${post.authorName}">Author</span>
              · <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">date</span>
            </p>
            <h1 class="h3 fw-bold mb-0" th:text="${post.title}">Post title</h1>
          </div>
          <div class="d-flex gap-2" th:if="${post.authorId == me.id}">
            <a th:href="@{'/blog?editPost=' + ${post.id} + '#compose-form'}" class="btn btn-outline-secondary btn-sm">Edit</a>
            <form th:action="@{'/blog/posts/' + ${post.id} + '/delete'}" method="post"
                  onsubmit="return confirm('Delete this post? This also deletes all its comments and can\'t be undone.');">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
            </form>
          </div>
        </div>

        <p style="white-space: pre-wrap;" th:text="${post.content}">Full post content</p>
      </div>

      <div class="panel">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">Backend: Comment System</p>
            <h2 class="h6 fw-bold mb-0" th:text="${#lists.size(comments)} + ' comment' + (${#lists.size(comments) == 1} ? '' : 's')">0 comments</h2>
          </div>
        </div>

        <div class="alert alert-success py-2" th:if="${param.commentSaved}">Comment posted.</div>
        <div class="alert alert-success py-2" th:if="${param.commentDeleted}">Comment deleted.</div>
        <div class="alert alert-danger py-2" th:if="${param.error != null}" th:text="${param.error[0]}">Error</div>
        <div class="alert alert-danger py-2" th:if="${commentError}" th:text="${commentError}">Something went wrong</div>

        <p class="text-secondary small mb-3" th:if="${#lists.isEmpty(comments)}">No comments yet — be the first to reply.</p>

        <div class="data-list mb-4" th:unless="${#lists.isEmpty(comments)}">
          <div class="review-card" th:each="comment : ${comments}">
            <div class="review-card-header">
              <div>
                <strong th:text="${comment.authorName}">Commenter</strong>
                <span class="badge text-bg-light text-capitalize" th:text="${#strings.toLowerCase(comment.authorRole)}">role</span>
              </div>
              <span th:text="${#temporals.format(comment.createdAt, 'dd MMM yyyy, h:mm a')}">date</span>
            </div>
            <p th:text="${comment.content}">Comment text</p>
            <form th:if="${comment.authorId == me.id}"
                  th:action="@{'/blog/posts/' + ${post.id} + '/comments/' + ${comment.id} + '/delete'}" method="post"
                  onsubmit="return confirm('Delete this comment?');">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
            </form>
          </div>
        </div>

        <form method="post" th:action="@{'/blog/posts/' + ${post.id} + '/comments'}" class="vstack gap-2">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="form-label" for="content">Add a comment</label>
          <textarea class="form-control" id="content" name="content" rows="3" maxlength="1000" required
                    placeholder="Ask a question or share your thoughts..."></textarea>
          <button class="btn btn-primary" type="submit" style="width:fit-content; padding-left:28px; padding-right:28px;">Post comment</button>
        </form>
      </div>
    </main>
  </body>
</html>
