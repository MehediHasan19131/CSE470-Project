<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Consultation History')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Consultation history', 'Your telemedicine video calls, past and upcoming', 'bi-clock-history')}"></div>

      <div class="panel">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">Telemedicine</p>
            <h2 class="h6 fw-bold mb-0">All consultations</h2>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
        <div class="data-list" id="consultationList">
          <div class="data-row"><span class="text-secondary">Loading…</span></div>
        </div>
      </div>

      <!-- Was small grey body text and easy to miss, which matters because it
           explains why the list above is empty. /appointments/manage no longer
           exists - appointment management lives at /appointments now. -->
      <div class="alert alert-info d-flex align-items-start gap-3 mt-4" role="note">
        <i class="bi bi-info-circle-fill fs-5 mt-1"></i>
        <div>
          <p class="fw-semibold mb-1">Video consultations need a confirmed appointment</p>
          <p class="mb-2">
            A consultation room is created once a doctor confirms your appointment.
            Book one first, then come back here to join the call.
          </p>
          <a th:href="@{/appointments/book}" class="btn btn-primary btn-sm">
            <i class="bi bi-calendar2-plus"></i> Book an appointment
          </a>
          <a th:href="@{/appointments}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-calendar-check"></i> My appointments
          </a>
        </div>
      </div>
    </main>

    <script>
      let currentUser = null;

      async function loadConsultations() {
        const list = document.getElementById('consultationList');
        const meRes = await fetch('/api/me', { credentials: 'same-origin' });
        currentUser = await meRes.json();

        const res = await fetch('/api/consultations/me', { credentials: 'same-origin' });
        if (!res.ok) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">Only patients and doctors have consultation history.</span></div>';
          return;
        }
        const items = await res.json();
        if (!items.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">No consultations yet.</span></div>';
          return;
        }
        list.innerHTML = items.map(c => {
          const otherParty = currentUser.role === 'DOCTOR' ? c.patientName : ('Dr. ' + c.doctorName);
          const canJoin = c.status === 'SCHEDULED' || c.status === 'IN_PROGRESS';
          const notesBlock = c.notes || c.prescription
            ? `<div class="mt-2 small text-secondary">${c.notes ? 'Notes: ' + c.notes : ''} ${c.prescription ? '<br>Prescription: ' + c.prescription : ''}</div>`
            : '';
          return `
            <div class="data-row" style="flex-direction:column;align-items:stretch;">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <strong>${otherParty}</strong>
                  <span>${new Date(c.scheduledAt).toLocaleString()}</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <span class="badge text-bg-light">${c.status}</span>
                  ${canJoin ? `<a href="/telemedicine/call/${c.id}" class="btn btn-sm btn-primary"><i class="bi bi-camera-video"></i> Join</a>` : ''}
                </div>
              </div>
              ${notesBlock}
            </div>
          `;
        }).join('');
      }

      document.getElementById('refreshBtn').addEventListener('click', loadConsultations);
      loadConsultations();
    </script>
  </body>
</html>
