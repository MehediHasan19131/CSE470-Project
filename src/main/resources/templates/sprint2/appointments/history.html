<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Appointment History')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">

      <div th:replace="~{fragments/dashboard-layout :: page-heading('Appointment History', 'View and manage your appointments', 'bi-calendar-check')}"></div>

      <div class="mb-3">
        <a class="btn btn-primary" href="/appointments/book">
          <i class="bi bi-plus-lg"></i> Book New Appointment
        </a>
      </div>

      <div th:if="${!#lists.isEmpty(appointments)}">
        <div class="appointment-list">
          <div class="appointment-card" th:each="a : ${appointments}">
            <div class="appointment-card-top">
              <div>
                <span class="appointment-doctor" th:text="${a.doctor.fullName}">Dr. Name</span>
                <span class="appointment-specialty" th:text="${a.doctor.profile != null ? a.doctor.profile.specialization : 'General'}">Specialty</span>
              </div>
              <span class="appointment-status" th:classappend="${a.status}" th:text="${#strings.capitalize(a.status)}">Pending</span>
            </div>
            <div class="appointment-card-body">
              <div class="appointment-detail">
                <i class="bi bi-calendar-event"></i>
                <span th:text="${#temporals.format(a.scheduledAt, 'dd MMM yyyy, hh:mm a')}">Date</span>
              </div>
              <div class="appointment-detail" th:if="${a.reason}">
                <i class="bi bi-chat-quote"></i>
                <span th:text="${a.reason}">Reason</span>
              </div>
              <div class="appointment-detail">
                <i class="bi bi-person"></i>
                <span th:text="${a.patient.fullName}">Patient</span>
              </div>
              <div class="appointment-detail">
                <i class="bi bi-clock"></i>
                <span th:text="${#temporals.format(a.createdAt, 'dd MMM yyyy')}">Booked on</span>
              </div>
            </div>
            <div class="appointment-card-actions" th:if="${a.status == 'pending' or a.status == 'confirmed'}">
              <form method="post" th:action="@{/appointments/{id}/cancel(id=${a.id})}" class="d-inline" th:if="${a.status == 'pending'}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-danger" type="submit">
                  <i class="bi bi-x-circle"></i> Cancel
                </button>
              </form>
              <form method="post" th:action="@{/appointments/{id}/confirm(id=${a.id})}" class="d-inline" th:if="${a.status == 'pending' and (user.role.name() == 'DOCTOR' or user.role.name() == 'ADMIN')}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-success" type="submit">
                  <i class="bi bi-check-circle"></i> Confirm
                </button>
              </form>
              <form method="post" th:action="@{/appointments/{id}/start-call(id=${a.id})}" class="d-inline" th:if="${a.status == 'confirmed'}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-primary" type="submit">
                  <i class="bi bi-camera-video"></i> Start video call
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="panel text-center py-5" th:unless="${!#lists.isEmpty(appointments)}">
        <i class="bi bi-calendar-x fs-1 text-secondary"></i>
        <p class="mt-3 mb-0 text-secondary">No appointments found.</p>
        <a class="btn btn-primary mt-3" href="/appointments/book">Book your first appointment</a>
      </div>

    </main>
  </body>
</html>
