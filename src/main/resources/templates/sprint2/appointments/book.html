<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Book Appointment')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">

      <div th:replace="~{fragments/dashboard-layout :: page-heading('Book an Appointment', 'Schedule a visit with a doctor', 'bi-calendar-plus')}"></div>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="panel">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <form method="post" action="/appointments/book" class="vstack gap-4">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <div>
                <label class="form-label fw-semibold">Select Doctor</label>
                <select class="form-select" name="doctorId" required>
                  <option value="" disabled selected>— Choose a doctor —</option>
                  <option th:each="d : ${doctors}" th:value="${d.id}" th:selected="${selectedDoctorId != null and selectedDoctorId == d.id}" th:text="${d.name()} + ' — ' + ${d.specialization() != null ? d.specialization() : 'General'} + ', ' + ${d.city() != null ? d.city() : 'N/A'}">Doctor</option>
                </select>
              </div>
              <div>
                <label class="form-label fw-semibold">Appointment type</label>
                <div class="d-flex gap-3 flex-wrap">
                  <label class="border rounded p-3 flex-fill"><input class="form-check-input me-2" type="radio" name="visitType" value="IN_PERSON" checked> <i class="bi bi-hospital"></i> In-person visit</label>
                  <label class="border rounded p-3 flex-fill"><input class="form-check-input me-2" type="radio" name="visitType" value="TELEMEDICINE"> <i class="bi bi-camera-video"></i> Telemedicine</label>
                </div>
                <small class="text-secondary">Each doctor can accept up to 12 appointments per day.</small>
              </div>
              <div>
                <label class="form-label fw-semibold">Date &amp; Time</label>
                <input class="form-control" type="datetime-local" name="scheduledAt" required>
                <small class="text-secondary">Pick a date and time for your appointment.</small>
              </div>
              <div>
                <label class="form-label fw-semibold">Reason (optional)</label>
                <textarea class="form-control" name="reason" rows="3" placeholder="Briefly describe your symptoms or reason for visit..."></textarea>
              </div>
              <div class="d-flex gap-3">
                <button class="btn btn-primary px-4" type="submit">
                  <i class="bi bi-check-lg"></i> Book Appointment
                </button>
                <a class="btn btn-outline-secondary px-4" href="/appointments">
                  <i class="bi bi-x-lg"></i> Cancel
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>

    </main>
  </body>
</html>
