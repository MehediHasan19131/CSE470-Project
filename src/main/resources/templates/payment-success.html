<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Payment successful')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container py-5" style="max-width: 560px;">
      <div class="panel text-center">
        <div class="payment-success-badge"><i class="bi bi-check-lg"></i></div>
        <h1 class="h4 fw-bold mt-3 mb-1">Payment successful</h1>
        <p class="text-secondary mb-4">Your sandbox payment has been recorded.</p>

        <div class="receipt">
          <div class="receipt-row">
            <span>Amount</span>
            <strong>৳<span th:text="${payment.amount}">0</span></strong>
          </div>
          <div class="receipt-row">
            <span>Paid for</span>
            <strong th:text="${payment.purpose}">Payment</strong>
          </div>
          <div class="receipt-row">
            <span>Method</span>
            <strong th:text="${payment.method}">bKash</strong>
          </div>
          <div class="receipt-row">
            <span>From account</span>
            <strong th:text="${payment.senderAccount}">017XXXXX678</strong>
          </div>
          <div class="receipt-row">
            <span>Transaction ID</span>
            <strong th:text="${payment.transactionId}">PAY-XXXX</strong>
          </div>
          <div class="receipt-row">
            <span>Status</span>
            <span class="badge text-bg-success" th:text="${payment.status}">SUCCESS</span>
          </div>
          <div class="receipt-row">
            <span>Date</span>
            <strong th:text="${#temporals.format(payment.createdAt, 'dd MMM yyyy, HH:mm')}">date</strong>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <a href="/payments" class="btn btn-outline-secondary w-100"><i class="bi bi-receipt"></i> My payments</a>
          <a href="/campaigns" class="btn btn-primary w-100"><i class="bi bi-heart"></i> Back to campaigns</a>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
