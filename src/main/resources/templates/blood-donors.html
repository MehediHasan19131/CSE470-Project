<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/dashboard-layout :: head('Blood Donors')}"></head><body><nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav><main class="container-fluid p-4"><div th:replace="~{fragments/dashboard-layout :: page-heading('Blood Donors', 'Find available donors or register to help save a life', 'bi-droplet-fill')}"></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><form class="panel mb-4 row g-3 align-items-end" method="get" action="/blood/donors"><div class="col-md-4"><label class="form-label">Blood group</label><select class="form-select" name="bloodGroup"><option value="">All groups</option><option th:each="group : ${bloodGroups}" th:value="${group}" th:text="${group}" th:selected="${group == selectedBloodGroup}"></option></select></div><div class="col-md-4"><label class="form-label">City</label><input class="form-control" name="city" placeholder="e.g. Dhaka" th:value="${selectedCity}"></div><div class="col-md-auto"><button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i> Search</button></div><div class="col-md-auto ms-md-auto"><a class="btn btn-primary" href="/blood/donors/new"><i class="bi bi-person-plus"></i> Register as donor</a></div></form><div class="row g-3" th:if="${!#lists.isEmpty(donors)}"><div class="col-md-6 col-xl-4" th:each="donor : ${donors}"><div class="panel h-100"><div class="d-flex justify-content-between gap-2"><strong th:text="${donor.fullName}">Donor</strong><span class="badge text-bg-danger" th:text="${donor.bloodGroup}">O+</span></div><p class="text-secondary small mb-1" th:text="${donor.city}">City</p><p class="mb-0"><i class="bi bi-telephone"></i> <a th:href="${'tel:' + donor.phone}" th:text="${donor.phone}">Phone</a></p></div></div></div><div class="panel text-center py-5" th:if="${#lists.isEmpty(donors)}"><i class="bi bi-droplet fs-1 text-secondary"></i><p class="text-secondary mb-0 mt-2">No available donors match your search.</p></div></main></body></html>
