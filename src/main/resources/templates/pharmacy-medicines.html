<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('My medicines')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('My medicines', 'Manage the products your pharmacy sells', 'bi-capsule')}"></div>

      <div class="alert alert-success py-2" th:if="${param.saved}">Saved.</div>
      <div class="alert alert-danger py-2" th:if="${param.error}">Couldn't save — please check the values and try again.</div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Add product</p>
                <h2 class="h6 fw-bold mb-0">New medicine</h2>
              </div>
            </div>
            <form method="post" action="/pharmacy/medicines" class="vstack gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <div>
                <label class="form-label">Name</label>
                <input class="form-control" name="name" maxlength="120" required placeholder="e.g. Napa Extra 500mg">
              </div>
              <div>
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="2" placeholder="Short description"></textarea>
              </div>
              <div class="row g-2">
                <div class="col">
                  <label class="form-label">Price (৳)</label>
                  <input class="form-control" name="price" type="number" min="0" step="0.01" required>
                </div>
                <div class="col">
                  <label class="form-label">Stock</label>
                  <input class="form-control" name="stock" type="number" min="0" value="0">
                </div>
              </div>
              <button class="btn btn-primary" type="submit" style="width:fit-content; padding-left:24px; padding-right:24px;">
                <i class="bi bi-plus-lg"></i> Add medicine
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Catalogue</p>
                <h2 class="h6 fw-bold mb-0" th:text="${#lists.size(medicines)} + ' product(s)'">0 products</h2>
              </div>
            </div>
            <p class="text-secondary small mb-0" th:if="${#lists.isEmpty(medicines)}">
              No products yet — add your first medicine on the left.
            </p>
            <div class="table-responsive" th:unless="${#lists.isEmpty(medicines)}">
              <table class="table align-middle mb-0">
                <thead>
                  <tr><th>Name</th><th class="text-end">Update price / stock / status</th></tr>
                </thead>
                <tbody>
                  <tr th:each="m : ${medicines}">
                    <td>
                      <strong th:text="${m.name}">name</strong>
                      <span class="badge text-bg-secondary ms-1" th:unless="${m.active}">Hidden</span>
                    </td>
                    <td>
                      <form th:action="@{'/pharmacy/medicines/' + ${m.id}}" method="post"
                            class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input class="form-control form-control-sm" name="price" type="number" min="0" step="0.01"
                               th:value="${m.price}" style="width:110px;" aria-label="Price">
                        <input class="form-control form-control-sm" name="stock" type="number" min="0"
                               th:value="${m.stockQuantity}" style="width:90px;" aria-label="Stock">
                        <div class="form-check mb-0">
                          <input class="form-check-input" type="checkbox" name="active" th:checked="${m.active}" th:id="'act' + ${m.id}">
                          <label class="form-check-label small" th:for="'act' + ${m.id}">Active</label>
                        </div>
                        <button class="btn btn-sm btn-outline-primary" type="submit">Save</button>
                      </form>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
