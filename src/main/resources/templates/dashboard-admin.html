<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Admin Dashboard')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Admin dashboard', 'Platform settings and user role management', 'bi-shield-check')}"></div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-people"></i></div>
            <span>Total Users</span>
            <strong th:text="${data.metrics.totalUsers}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-person-check"></i></div>
            <span>Active Users</span>
            <strong th:text="${data.metrics.activeUsers}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-shield-lock"></i></div>
            <span>Admins</span>
            <strong th:text="${data.metrics.adminUsers}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-heart-pulse"></i></div>
            <span>Patients</span>
            <strong th:text="${data.metrics.patientUsers}">0</strong>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-person-badge"></i></div>
            <span>Doctors</span>
            <strong th:text="${data.metrics.doctorUsers}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-hospital"></i></div>
            <span>Facilities</span>
            <strong th:text="${data.metrics.totalFacilities}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-calendar-check"></i></div>
            <span>Appointments</span>
            <strong th:text="${data.metrics.totalAppointments}">0</strong>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="metric-card">
            <div class="metric-icon"><i class="bi bi-capsule"></i></div>
            <span>Medicines</span>
            <strong th:text="${data.metrics.totalMedicines}">0</strong>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Administration</p>
                <h2 class="h6 fw-bold mb-0">Quick actions</h2>
              </div>
            </div>
            <div class="action-grid">
              <a class="action-tile" href="/admin/users"><i class="bi bi-people"></i><span>Manage users</span></a>
              <a class="action-tile" href="/admin/reports"><i class="bi bi-inbox"></i><span>Review reports</span></a>
              <a class="action-tile" href="/payments"><i class="bi bi-receipt"></i><span>Payments audit</span></a>
              <a class="action-tile" href="/reviews"><i class="bi bi-star"></i><span>Providers &amp; reviews</span></a>
            </div>
            <a class="btn btn-outline-primary btn-sm mt-3" href="/admin"><i class="bi bi-shield-check"></i> Open full admin panel</a>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="panel h-100">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Platform</p>
                <h2 class="h6 fw-bold mb-0">Application Settings</h2>
              </div>
            </div>
            <div class="data-list">
              <div class="data-row" th:each="setting : ${data.settings}">
                <div>
                  <strong th:text="${setting.key}">key</strong>
                  <span th:text="${setting.value}">value</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
