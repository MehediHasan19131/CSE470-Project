<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FAQ | SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg app-navbar sticky-top">
      <div class="container-fluid px-4">
        <a class="brand-logo" href="/" aria-label="SmartCare home">
          <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="174" height="46">
        </a>
        <div class="nav-actions">
          <a href="/" class="nav-pill nav-pill-muted"><i class="bi bi-house"></i> Home</a>
          <a href="/map" class="nav-pill nav-pill-muted"><i class="bi bi-geo-alt"></i> Find care</a>
          <a href="/register" class="nav-pill"><i class="bi bi-person-plus"></i> Create account</a>
        </div>
      </div>
    </nav>

    <main class="container py-5" style="max-width: 900px;">
      <div class="text-center mb-5">
        <p class="text-uppercase text-primary small fw-semibold mb-2">Help centre</p>
        <h1 class="fw-bold mb-2">Frequently Asked Questions</h1>
        <p class="text-secondary mb-0">Everything you need to know about using SmartCare.</p>
      </div>

      <div class="accordion" id="faqAccordion" th:if="${!#lists.isEmpty(faqs)}">
        <div class="accordion-item" th:each="faq, item : ${faqs}">
          <h2 class="accordion-header" th:id="'faq-heading-' + ${faq.id}">
            <button class="accordion-button" th:classappend="${item.first} ? '' : ' collapsed'" type="button"
                    data-bs-toggle="collapse" th:data-bs-target="'#faq-' + ${faq.id}"
                    th:aria-expanded="${item.first}" th:text="${faq.question}">Question</button>
          </h2>
          <div class="accordion-collapse collapse" th:classappend="${item.first} ? ' show' : ''"
               th:id="'faq-' + ${faq.id}" data-bs-parent="#faqAccordion">
            <div class="accordion-body" style="white-space: pre-line;" th:text="${faq.answer}">Answer</div>
          </div>
        </div>
      </div>
      <div class="text-center py-4 text-secondary" th:if="${#lists.isEmpty(faqs)}">
        No FAQs have been published yet.
      </div>

      <div class="text-center mt-5">
        <p class="text-secondary mb-2">Still have questions?</p>
        <a href="mailto:support@smartcare.local" class="btn btn-primary"><i class="bi bi-envelope"></i> Contact support</a>
      </div>
    </main>

    <footer th:replace="~{fragments/site-footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
