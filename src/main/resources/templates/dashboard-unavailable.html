<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Dashboard')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Dashboard unavailable', 'A dedicated dashboard for this role is not available', 'bi-tools')}"></div>

      <div class="panel text-center py-5">
        <i class="bi bi-tools text-secondary" style="font-size: 3rem;"></i>
        <p class="text-secondary mt-3 mb-0" th:text="${data.message}">
          A dedicated dashboard for this role is not yet available.
        </p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
