<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Dashboard Unavailable')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div class="panel unavailable-panel">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1" th:text="${#strings.toLowerCase(user.role)} + ' dashboard'">role dashboard</p>
            <h1 class="h4 fw-bold mb-2">Not included in Sprint 1</h1>
            <p class="text-secondary mb-0" th:text="${data.message}">This role dashboard is planned for a later sprint.</p>
          </div>
        </div>
        <p class="mb-0 mt-3">Sprint 1 includes Admin, Patient, Doctor, Hospital, and Pharmacy dashboards only.</p>
      </div>
    </main>
  </body>
</html>
