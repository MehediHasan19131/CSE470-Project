<!-- SPRINT 3 MERGE NOTE: this file REPLACES the Sprint 2 version of dashboard-doctor.html.
     Adds a quick-action tile linking to Telemedicine consultation history. -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Doctor Dashboard')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Doctor dashboard', 'Patient serial, schedule, and feedback', 'bi-person-vcard')}"></div>

      <div class="sprint-badge mb-4">
        <i class="bi bi-info-circle"></i>
        <span>Sprint 3: start Jitsi video consultations directly from confirmed appointments.</span>
      </div>

      <div class="panel">
        <div class="section-title">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">Quick actions</p>
            <h2 class="h6 fw-bold mb-0">Care &amp; services</h2>
          </div>
        </div>
        <div class="action-grid">
          <a href="/appointments/manage" class="action-tile">
            <i class="bi bi-calendar2-check"></i>
            <span>Manage appointments</span>
          </a>
          <a href="/telemedicine/history" class="action-tile">
            <i class="bi bi-camera-video"></i>
            <span>Video consultations</span>
          </a>
          <a href="/reviews" class="action-tile">
            <i class="bi bi-star-half"></i>
            <span>Reviews about me</span>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
