<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Checkout')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container py-4" style="max-width: 720px;">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Secure checkout', 'Pay with bKash or Bank / Card', 'bi-credit-card')}"></div>

      <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}">Error</div>

      <div class="panel mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <p class="text-uppercase text-primary small fw-semibold mb-1">Paying for</p>
            <h2 class="h6 fw-bold mb-0" th:text="${purposeLabel}">Payment</h2>
          </div>
          <div class="text-end">
            <p class="text-uppercase text-secondary small fw-semibold mb-1">Amount</p>
            <strong class="fs-4">৳<span th:text="${amount}">0</span></strong>
          </div>
        </div>
      </div>

      <div class="panel">
        <ul class="nav nav-pills mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#bkashPane" type="button">
              <i class="bi bi-phone"></i> bKash
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#bankPane" type="button">
              <i class="bi bi-bank"></i> Bank / Card
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- bKash -->
          <div class="tab-pane fade show active" id="bkashPane">
            <form method="post" action="/payment/process" class="vstack gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <input type="hidden" name="method" value="bKash">
              <input type="hidden" name="amount" th:value="${amount}">
              <input type="hidden" name="purpose" th:value="${purposeLabel}">
              <input type="hidden" name="intent" th:value="${intent}" th:if="${intent != null}">
              <input type="hidden" name="campaignId" th:value="${campaignId}" th:if="${campaignId != null}">
              <input type="hidden" name="message" th:value="${message}" th:if="${message != null}">
              <input type="hidden" name="medicineId" th:value="${medicineId}" th:if="${medicineId != null}">
              <input type="hidden" name="quantity" th:value="${quantity}" th:if="${quantity != null}">
              <input type="hidden" name="deliveryAddress" th:value="${deliveryAddress}" th:if="${deliveryAddress != null}">
              <input type="hidden" name="providerId" th:value="${providerId}" th:if="${providerId != null}">
              <input type="hidden" name="itemName" th:value="${itemName}" th:if="${itemName != null}">
              <input type="hidden" name="requestId" th:value="${requestId}" th:if="${requestId != null}">

              <div class="bkash-brand"><i class="bi bi-phone-vibrate"></i> bKash Mobile Payment</div>
              <div>
                <label class="form-label">bKash account number</label>
                <input class="form-control" name="accountNumber" inputmode="numeric"
                       placeholder="01XXXXXXXXX" pattern="[0-9]{11}" maxlength="11" required>
              </div>
              <div>
                <label class="form-label">bKash PIN</label>
                <input class="form-control" name="pin" type="password" inputmode="numeric"
                       placeholder="•••••" pattern="[0-9]{4,6}" maxlength="6" required>
              </div>
              <button class="btn w-100 btn-bkash" type="submit">
                <i class="bi bi-shield-lock"></i> Pay ৳<span th:text="${amount}">0</span> with bKash
              </button>
            </form>
          </div>

          <!-- Bank / Card -->
          <div class="tab-pane fade" id="bankPane">
            <form method="post" action="/payment/process" class="vstack gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <input type="hidden" name="method" value="Bank Card">
              <input type="hidden" name="amount" th:value="${amount}">
              <input type="hidden" name="purpose" th:value="${purposeLabel}">
              <input type="hidden" name="intent" th:value="${intent}" th:if="${intent != null}">
              <input type="hidden" name="campaignId" th:value="${campaignId}" th:if="${campaignId != null}">
              <input type="hidden" name="message" th:value="${message}" th:if="${message != null}">
              <input type="hidden" name="medicineId" th:value="${medicineId}" th:if="${medicineId != null}">
              <input type="hidden" name="quantity" th:value="${quantity}" th:if="${quantity != null}">
              <input type="hidden" name="deliveryAddress" th:value="${deliveryAddress}" th:if="${deliveryAddress != null}">
              <input type="hidden" name="providerId" th:value="${providerId}" th:if="${providerId != null}">
              <input type="hidden" name="itemName" th:value="${itemName}" th:if="${itemName != null}">
              <input type="hidden" name="requestId" th:value="${requestId}" th:if="${requestId != null}">

              <div>
                <label class="form-label">Card / account number</label>
                <input class="form-control" name="accountNumber" inputmode="numeric"
                       placeholder="1234 5678 9012 3456" maxlength="19" required>
              </div>
              <div class="row g-2">
                <div class="col">
                  <label class="form-label">Expiry</label>
                  <input class="form-control" name="expiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="col">
                  <label class="form-label">CVV / PIN</label>
                  <input class="form-control" name="pin" type="password" inputmode="numeric"
                         placeholder="•••" pattern="[0-9]{3,6}" maxlength="6" required>
                </div>
              </div>
              <button class="btn btn-primary w-100" type="submit">
                <i class="bi bi-shield-lock"></i> Pay ৳<span th:text="${amount}">0</span>
              </button>
            </form>
          </div>
        </div>

        <p class="text-secondary small text-center mt-4 mb-0">
          <i class="bi bi-lock-fill"></i> Sandbox demo gateway — no real money is transferred and no card data is stored.
        </p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
