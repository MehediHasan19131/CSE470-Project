<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/dashboard-layout :: head('Donor Registration')}"></head><body><nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav><main class="container" style="max-width:760px"><div class="page-heading mt-4"><div><p class="text-uppercase text-primary small fw-semibold mb-1">Blood donation</p><h1 class="h4 fw-bold">Register as a donor</h1></div></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form class="panel vstack gap-3" method="post" action="/blood/donors"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div><label class="form-label">Full name</label><input class="form-control" name="fullName" required th:value="${user.fullName}"></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Blood group</label><select class="form-select" name="bloodGroup" required><option value="">Select group</option><option th:each="group : ${bloodGroups}" th:value="${group}" th:text="${group}"></option></select></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required th:value="${user.phone}"></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" placeholder="Dhaka"></div><div class="col-md-6"><label class="form-label">Last donation date</label><input class="form-control" type="date" name="lastDonationDate"></div></div><div class="form-check"><input class="form-check-input" type="checkbox" name="available" id="available" checked><label class="form-check-label" for="available">I am currently available to donate.</label></div><div><button class="btn btn-primary" type="submit">Register donor</button><a class="btn btn-outline-secondary ms-2" href="/blood/donors">Cancel</a></div></form></main></body></html>
