<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — SmartCare'">SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/sprint1.css" rel="stylesheet">
    <link href="/css/sprint2.css" rel="stylesheet">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom mb-0">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
            <img src="/img/smartcare-icon.svg" alt="" width="32" height="32" class="d-inline-block">
            <span class="fw-bold" style="color: #0f7c90;">SmartCare</span>
        </a>
        <!--
          Role-aware navigation. Every link here is one a user of that role can
          actually act on, so nobody is shown a page that will 403 or come back
          empty. The controllers already scope their data by role - /appointments
          returns a doctor's own appointments and a patient's own, and /orders is
          patient-scoped - so the nav mirrors that rather than inventing new rules.
        -->
        <div class="d-flex align-items-center gap-3" th:with="role=${user != null ? user.role.name() : ''}">

            <!-- Patients: the full set of things they can browse and buy. -->
            <a href="/doctors" class="btn btn-outline-primary btn-sm"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-person-badge"></i> Doctors
            </a>
            <a href="/appointments" class="btn btn-outline-primary btn-sm"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-calendar-check"></i> Appointments
            </a>
            <a href="/pharmacy-store" class="btn btn-outline-primary btn-sm"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-capsule"></i> Pharmacy
            </a>
            <a href="/reviews" class="btn btn-outline-primary btn-sm"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-star"></i> Reviews
            </a>

            <!-- Doctors: their own schedule only. AppointmentController already
                 returns doctorHistory() for this role. -->
            <a href="/appointments" class="btn btn-outline-primary btn-sm"
               th:if="${role == 'DOCTOR'}">
                <i class="bi bi-calendar-check"></i> My Appointments
            </a>

            <!-- Providers see the reviews written about them, not the directory
                 of everyone else. /reviews/{id} is that provider's own page. -->
            <a class="btn btn-outline-primary btn-sm"
               th:if="${role == 'DOCTOR' or role == 'HOSPITAL' or role == 'PHARMACY'
                        or role == 'DIAGNOSTIC' or role == 'AMBULANCE'}"
               th:href="@{'/reviews/' + ${user.id}}">
                <i class="bi bi-star"></i> My Reviews
            </a>

            <!-- Admin panel. -->
            <a href="/admin" class="btn btn-outline-primary btn-sm" th:if="${role == 'ADMIN'}">
                <i class="bi bi-shield-check"></i> Admin
            </a>

            <span class="badge text-bg-primary text-capitalize"
                  th:text="${user != null ? #strings.toLowerCase(user.role) : ''}">role</span>
            <span class="text-secondary small" th:text="${user != null ? user.fullName : ''}">User</span>
            <a class="btn btn-outline-secondary btn-sm" href="/logout">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div th:fragment="page-heading(title, subtitle, icon)" class="page-heading">
    <div>
        <p class="text-uppercase text-primary small fw-semibold mb-1">
            <i class="bi" th:classappend="${icon}"></i>
            <span th:text="${title}">Page Title</span>
        </p>
        <h1 class="h4 fw-bold mb-0" th:text="${title}">Page Title</h1>
        <p class="text-secondary small mt-1 mb-0" th:text="${subtitle}">Subtitle</p>
    </div>
</div>

</html>
