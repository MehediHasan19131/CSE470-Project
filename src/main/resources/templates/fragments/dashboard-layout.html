<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — SmartCare'">SmartCare</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/sprint1.css" rel="stylesheet">
    <link href="/css/sprint2.css" rel="stylesheet">
</head>

<a th:fragment="brand-logo(link)" th:href="${link}" class="brand-logo" aria-label="SmartCare home">
    <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="174" height="46">
</a>

<nav th:fragment="navbar" class="navbar navbar-expand-lg app-navbar sticky-top">
    <div class="container-fluid px-4">
        <a class="brand-logo" href="/dashboard" aria-label="SmartCare home">
            <img src="/img/smartcare-logo.svg" alt="SmartCare Healthcare Platform" class="brand-logo-img" width="174" height="46">
        </a>
        <!--
          Role-aware navigation. Every link here is one a user of that role can
          actually act on, so nobody is shown a page that will 403 or come back
          empty. The controllers already scope their data by role - /appointments
          returns a doctor's own appointments and a patient's own, and /orders is
          patient-scoped - so the nav mirrors that rather than inventing new rules.
        -->
        <div class="nav-actions" th:with="role=${user != null ? user.role.name() : ''}">

            <!-- Patients: the full set of things they can browse and buy. -->
            <a href="/doctors" class="nav-pill"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-person-badge"></i><span>Doctors</span>
            </a>
            <a href="/appointments" class="nav-pill"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-calendar-check"></i><span>Appointments</span>
            </a>
            <!-- Hospital & Diagnostic Module (Member 3): patients browse
                 hospitals/diagnostic centres/pharmacies here to see bed
                 availability, doctor availability, services, and test offers. -->
            <a href="/facilities" class="nav-pill"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-hospital"></i><span>Hospitals &amp; Labs</span>
            </a>
            <a href="/pharmacy-store" class="nav-pill"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-capsule"></i><span>Pharmacy</span>
            </a>
            <a href="/reviews" class="nav-pill"
               th:if="${role == 'PATIENT' or role == 'ADMIN'}">
                <i class="bi bi-star"></i><span>Reviews</span>
            </a>
            <a href="/medicine-reminders" class="nav-pill"
               th:if="${role == 'PATIENT'}">
                <i class="bi bi-alarm"></i><span>Medicine Reminders</span>
            </a>

            <!-- Doctors: their own schedule only. AppointmentController already
                 returns doctorHistory() for this role. -->
            <a href="/appointments" class="nav-pill"
               th:if="${role == 'DOCTOR'}">
                <i class="bi bi-calendar-check"></i><span>My Appointments</span>
            </a>

            <!-- Medical Records Sharing: patients who've granted this doctor
                 access to their medical history/allergies. -->
            <a href="/doctor/patients" class="nav-pill" th:if="${role == 'DOCTOR'}">
                <i class="bi bi-file-earmark-medical"></i><span>My Patients</span>
            </a>

            <!-- Providers see the reviews written about them, not the directory
                 of everyone else. /reviews/{id} is that provider's own page. -->
            <a class="nav-pill"
               th:if="${role == 'DOCTOR' or role == 'HOSPITAL' or role == 'PHARMACY'
                        or role == 'DIAGNOSTIC' or role == 'AMBULANCE'}"
               th:href="@{'/reviews/' + ${user.id}}">
                <i class="bi bi-star"></i><span>My Reviews</span>
            </a>

            <!-- Telemedicine (Sprint 3): consultations are between a patient
                 and a doctor, so only those two roles get the link. -->
            <a href="/telemedicine/history" class="nav-pill"
               th:if="${role == 'PATIENT' or role == 'DOCTOR'}">
                <i class="bi bi-camera-video"></i><span>Telemedicine</span>
            </a>

            <!-- Admin panel. -->
            <a href="/admin" class="nav-pill nav-pill-admin" th:if="${role == 'ADMIN'}">
                <i class="bi bi-shield-check"></i><span>Admin</span>
            </a>

            <!-- Hospital & Diagnostic Module (Member 3): each facility manages its
                 own thing - matches SecurityConfig's "/hospital/**" and
                 "/diagnostic/**" rules. -->
            <a href="/hospital/manage" class="nav-pill" th:if="${role == 'HOSPITAL'}">
                <i class="bi bi-clipboard2-pulse"></i><span>Manage Facility</span>
            </a>
            <a href="/diagnostic/manage" class="nav-pill" th:if="${role == 'DIAGNOSTIC'}">
                <i class="bi bi-clipboard2-pulse"></i><span>Manage Tests</span>
            </a>

            <!-- Notifications & Campaigns (Sprint 3/4 - Imtiaz Zaman Sami): open
                 to every logged-in role, same as their controllers (authenticated(),
                 no role restriction). -->
            <a href="/notifications" class="nav-pill" th:if="${user != null}">
                <i class="bi bi-bell"></i><span>Notifications</span>
            </a>
            <a href="/campaigns" class="nav-pill" th:if="${user != null}">
                <i class="bi bi-heart-pulse"></i><span>Campaigns</span>
            </a>

            <!-- Health Profile (Sprint 3 - Nahian Mahmud): a patient's own medical
                 history/allergies, so PATIENT only - matches SecurityConfig's
                 "/health-profile/**" rule. -->
            <a href="/health-profile" class="nav-pill" th:if="${role == 'PATIENT'}">
                <i class="bi bi-file-earmark-medical"></i><span>Health Profile</span>
            </a>

            <!-- Health Blog (Sprint 4 - Nahian Mahmud): open to every logged-in
                 role, same as BlogWebController (authenticated(), no role rule). -->
            <a href="/blog" class="nav-pill" th:if="${user != null}">
                <i class="bi bi-journal-richtext"></i><span>Health Blog</span>
            </a>

            <span class="nav-divider" aria-hidden="true"></span>

            <a class="nav-user" href="/profile">
                <span class="nav-user-avatar"
                      th:text="${user != null and user.fullName != null and !user.fullName.isEmpty()
                                ? #strings.toUpperCase(user.fullName.substring(0,1)) : '?'}">U</span>
                <span class="nav-user-meta">
                    <strong th:text="${user != null ? user.fullName : ''}">User</strong>
                    <em th:text="${user != null ? #strings.toLowerCase(user.role) : ''}">role</em>
                </span>
            </a>

            <a class="nav-pill nav-pill-logout" href="/logout">
                <i class="bi bi-box-arrow-right"></i><span>Logout</span>
            </a>
        </div>
    </div>
</nav>

<div th:fragment="page-heading(title, subtitle, icon)" class="page-heading">
    <div>
        <p class="text-uppercase text-primary small fw-semibold mb-1">
            <i class="bi" th:classappend="${icon}"></i>
            <span th:text="${title}">Page Title</span>
        </p>
        <h1 class="h4 fw-bold mb-0" th:text="${title}">Page Title</h1>
        <p class="text-secondary small mt-1 mb-0" th:text="${subtitle}">Subtitle</p>
    </div>
</div>

</html>
