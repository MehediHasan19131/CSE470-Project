<!-- SPRINT 3 MERGE NOTE: this file REPLACES the Sprint 2 version of appointment-booking.html.
     Change: confirmed appointments now show a "Start video call" button that creates/opens the
     Jitsi telemedicine room for that appointment (Sprint 3 — Telemedicine). -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Appointment Booking')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Book an appointment', 'Search doctors by speciality and location, then book a slot', 'bi-calendar2-check')}"></div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="panel mb-4">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Search</p>
                <h2 class="h6 fw-bold mb-0">Find a doctor</h2>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <input type="text" class="form-control" id="specialityFilter" placeholder="Speciality e.g. Cardiology">
              </div>
              <div class="col-sm-5">
                <input type="text" class="form-control" id="locationFilter" placeholder="City">
              </div>
              <div class="col-sm-1 d-grid">
                <button class="btn btn-primary" id="searchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div class="data-list" id="doctorList">
              <div class="data-row"><span class="text-secondary">Loading…</span></div>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="panel mb-4" id="bookingPanel" style="display:none;">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Selected doctor</p>
                <h2 class="h6 fw-bold mb-0" id="selectedDoctorName">—</h2>
              </div>
            </div>
            <form id="bookingForm" class="vstack gap-3">
              <div>
                <label class="form-label">Date &amp; time</label>
                <input type="datetime-local" class="form-control" id="scheduledAt" required>
              </div>
              <div>
                <label class="form-label">Reason for visit</label>
                <textarea class="form-control" id="reason" rows="3" placeholder="Describe your symptoms or reason"></textarea>
              </div>
              <div class="alert alert-danger py-2 d-none" id="bookingError"></div>
              <div class="alert alert-success py-2 d-none" id="bookingSuccess"></div>
              <button type="submit" class="btn btn-primary">Confirm booking</button>
            </form>
          </div>

          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">My schedule</p>
                <h2 class="h6 fw-bold mb-0">My appointments</h2>
              </div>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshAppointments"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="data-list" id="myAppointments">
              <div class="data-row"><span class="text-secondary">Loading…</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      let selectedDoctorId = null;

      async function searchDoctors() {
        const speciality = document.getElementById('specialityFilter').value;
        const location = document.getElementById('locationFilter').value;
        const params = new URLSearchParams();
        if (speciality) params.set('speciality', speciality);
        if (location) params.set('location', location);
        const res = await fetch(`/api/doctors/search?${params.toString()}`, { credentials: 'same-origin' });
        const doctors = await res.json();
        const list = document.getElementById('doctorList');
        if (!doctors.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">No doctors match your search.</span></div>';
          return;
        }
        list.innerHTML = doctors.map(d => `
          <div class="data-row">
            <div>
              <strong>${d.name}</strong>
              <span>${d.specialization || 'General'} · ${d.city || 'Unknown city'} · ★ ${d.averageRating} (${d.totalReviews})</span>
            </div>
            <button class="btn btn-outline-primary btn-sm" onclick="selectDoctor(${d.id}, '${d.name.replace(/'/g, "\\'")}')">Book</button>
          </div>
        `).join('');
      }

      function selectDoctor(id, name) {
        selectedDoctorId = id;
        document.getElementById('selectedDoctorName').textContent = name;
        document.getElementById('bookingPanel').style.display = 'block';
        document.getElementById('bookingError').classList.add('d-none');
        document.getElementById('bookingSuccess').classList.add('d-none');
      }

      document.getElementById('searchBtn').addEventListener('click', searchDoctors);

      document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById('bookingError');
        const successBox = document.getElementById('bookingSuccess');
        errorBox.classList.add('d-none');
        successBox.classList.add('d-none');
        try {
          const res = await fetch('/api/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              doctorId: selectedDoctorId,
              scheduledAt: document.getElementById('scheduledAt').value,
              reason: document.getElementById('reason').value
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || 'Could not book the appointment.');
          }
          successBox.textContent = 'Appointment requested. The doctor will confirm it shortly.';
          successBox.classList.remove('d-none');
          loadAppointments();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.remove('d-none');
        }
      });

      async function loadAppointments() {
        const list = document.getElementById('myAppointments');
        const res = await fetch('/api/appointments/me', { credentials: 'same-origin' });
        const items = await res.json();
        if (!items.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">No appointments yet.</span></div>';
          return;
        }
        list.innerHTML = items.map(a => `
          <div class="data-row">
            <div>
              <strong>Dr. ${a.doctorName}</strong>
              <span>${new Date(a.scheduledAt).toLocaleString()} ${a.reminderDue ? '· <span class="text-danger">reminder: within 24h</span>' : ''}</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge text-bg-light text-capitalize">${a.status}</span>
              ${a.status === 'confirmed' ? `<button class="btn btn-sm btn-outline-primary" onclick="startVideoCall(${a.id})"><i class="bi bi-camera-video"></i> Video call</button>` : ''}
              ${a.status !== 'cancelled' && a.status !== 'completed' ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelAppointment(${a.id})">Cancel</button>` : ''}
            </div>
          </div>
        `).join('');
      }

      async function startVideoCall(appointmentId) {
        try {
          const res = await fetch('/api/consultations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ appointmentId })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || 'Could not start the video call.');
          }
          const consultation = await res.json();
          window.location.href = `/telemedicine/call/${consultation.id}`;
        } catch (err) {
          alert(err.message);
        }
      }

      async function cancelAppointment(id) {
        await fetch(`/api/appointments/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ status: 'cancelled' })
        });
        loadAppointments();
      }

      document.getElementById('refreshAppointments').addEventListener('click', loadAppointments);

      searchDoctors();
      loadAppointments();
    </script>
  </body>
</html>
