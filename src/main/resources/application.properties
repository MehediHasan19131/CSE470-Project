spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# The Review & Rating module (Sprint 2 - Nahian Mahmud) is plain JDBC, so its
# two tables are not created by Hibernate. Run its scripts explicitly.
# defer-datasource-initialization delays them until after Hibernate has built
# the JPA tables, which they reference by foreign key (reviews -> users).
# schema.sql and data.sql are deliberately NOT listed: Hibernate creates those
# tables and the CommandLineRunner in HealthcarePlatformApplication seeds them.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:review-schema.sql
spring.sql.init.data-locations=classpath:review-data.sql

spring.thymeleaf.cache=false

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

app.jwt.secret=${JWT_SECRET:SmartCareMember4Sprint1JwtSecretKeyMustBeAtLeast256BitsLongForHS256!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Chat / Symptom Checker (Sprint 4 - Mehedi Hasan). Points at a locally self-hosted
# Llama-based medical model served by Ollama (https://ollama.com). See sprint4/README.md.
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:openbiollm}

# Email notifications (Sprint 4 - Imtiaz Zaman Sami). Disabled by default since most
# dev setups won't have SMTP credentials configured; EmailService logs instead of
# sending when disabled.
app.mail.enabled=false
app.mail.from=no-reply@smartcare.local
spring.mail.host=localhost
