spring.application.name=SmartCare: Integrated Healthcare Management and Telemedicine System

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/healthcare_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Several modules are plain JDBC (no Hibernate entity), so their tables aren't
# created by Hibernate. Run their scripts explicitly. defer-datasource-initialization
# delays them until after Hibernate has built the JPA tables, which some of these
# reference by foreign key (e.g. reviews -> users).
#   review-schema.sql / review-data.sql  (Review & Rating - Sprint 2, Nahian Mahmud)
#   health-schema.sql / health-data.sql  (Health Profile: medical history, allergies - Sprint 3, Nahian Mahmud)
#   blog-schema.sql / blog-data.sql      (Blog: posts, comments - Sprint 4, Nahian Mahmud)
# schema.sql / data.sql are deliberately NOT listed: Hibernate creates the users
# table from the JPA User entity, and the CommandLineRunner in
# HealthcarePlatformApplication seeds it.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:review-schema.sql,classpath:health-schema.sql,classpath:blog-schema.sql
spring.sql.init.data-locations=classpath:review-data.sql,classpath:health-data.sql,classpath:blog-data.sql

spring.thymeleaf.cache=false

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

app.jwt.secret=${JWT_SECRET:SmartCareMember4Sprint1JwtSecretKeyMustBeAtLeast256BitsLongForHS256!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Chat / Symptom Checker (Sprint 4 - Mehedi Hasan). Points at a locally self-hosted
# Llama-based medical model served by Ollama (https://ollama.com). See sprint4/README.md.
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:openbiollm}

# Email notifications (Sprint 4 - Imtiaz Zaman Sami). Disabled by default since most
# dev setups won't have SMTP credentials configured; EmailService logs instead of
# sending when disabled.
app.mail.enabled=false
app.mail.from=no-reply@smartcare.local
spring.mail.host=localhost
