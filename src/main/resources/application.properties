spring.application.name=SmartCare: Integrated Healthcare Management and Telemedicine System

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:health_user}
spring.datasource.password=${DB_PASSWORD:health_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=8000

app.jwt.secret=${JWT_SECRET:SmartCareMember4Sprint1JwtSecretKeyMustBeAtLeast256BitsLongForHS256!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
