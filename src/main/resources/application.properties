spring.application.name=SmartCare: Integrated Healthcare Management and Telemedicine System

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:health_user}
spring.datasource.password=${DB_PASSWORD:health_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No JPA/Hibernate anywhere in this submission. Table creation + demo data come
# from plain SQL files that Spring Boot runs via JDBC on every startup:
#   src/main/resources/schema.sql         (CREATE TABLE users)
#   src/main/resources/data.sql           (demo accounts)
#   src/main/resources/review-schema.sql  (CREATE TABLE reviews, ratings - Member 2)
#   src/main/resources/review-data.sql    (demo reviews - Member 2)
#   src/main/resources/health-schema.sql  (CREATE TABLE medical_history, allergies - Member 1, Sprint 3)
#   src/main/resources/health-data.sql    (demo medical history + allergies - Member 1, Sprint 3)
#   src/main/resources/blog-schema.sql    (CREATE TABLE posts, comments - Sprint 4)
#   src/main/resources/blog-data.sql      (demo posts + comments - Sprint 4)
# Listed explicitly (instead of relying on the schema.sql/data.sql auto-detect)
# so every member's scripts run, in order, on every startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:review-schema.sql,classpath:health-schema.sql,classpath:blog-schema.sql
spring.sql.init.data-locations=classpath:data.sql,classpath:review-data.sql,classpath:health-data.sql,classpath:blog-data.sql

spring.thymeleaf.cache=false
server.port=8000

# JWT settings for the stateless /api/auth/token endpoint (Member 1: Auth module).
# Does not affect the existing session-based login above.
app.jwt.secret=${JWT_SECRET:ChangeThisToASecureRandomSecretKeyThatIsAtLeast256BitsLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
