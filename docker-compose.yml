services:
  mysql:
    image: mysql:8.4
    container_name: healthcare-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: healthcare_platform
      MYSQL_USER: health_user
      MYSQL_PASSWORD: health_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
