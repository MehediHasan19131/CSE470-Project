<!-- SPRINT 3 MERGE NOTE: this file REPLACES the Sprint 2 version of appointment-management.html.
     Change: confirmed appointments now show a "Start video call" button for the doctor
     (Sprint 3 — Telemedicine). -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/dashboard-layout :: head('Appointment Management')}"></head>
  <body>
    <nav th:replace="~{fragments/dashboard-layout :: navbar}"></nav>

    <main class="container-fluid p-4">
      <div th:replace="~{fragments/dashboard-layout :: page-heading('Manage appointments', 'Confirm, complete, or cancel patient appointment requests', 'bi-person-vcard')}"></div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Reminders</p>
                <h2 class="h6 fw-bold mb-0">Due within 24 hours</h2>
              </div>
            </div>
            <div class="data-list" id="reminderList">
              <div class="data-row"><span class="text-secondary">Loading…</span></div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="panel">
            <div class="section-title">
              <div>
                <p class="text-uppercase text-primary small fw-semibold mb-1">Queue</p>
                <h2 class="h6 fw-bold mb-0">All appointments</h2>
              </div>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="data-list" id="appointmentList">
              <div class="data-row"><span class="text-secondary">Loading…</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      async function loadReminders() {
        const box = document.getElementById('reminderList');
        const res = await fetch('/api/appointments/reminders', { credentials: 'same-origin' });
        const items = await res.json();
        box.innerHTML = items.length
          ? items.map(a => `<div class="data-row"><div><strong>${a.patientName}</strong><span>${new Date(a.scheduledAt).toLocaleString()}</span></div><span class="badge text-bg-danger">Soon</span></div>`).join('')
          : '<div class="data-row"><span class="text-secondary">Nothing due soon.</span></div>';
      }

      async function loadAppointments() {
        const list = document.getElementById('appointmentList');
        const res = await fetch('/api/appointments/me', { credentials: 'same-origin' });
        const items = await res.json();
        if (!items.length) {
          list.innerHTML = '<div class="data-row"><span class="text-secondary">No appointments yet.</span></div>';
          return;
        }
        list.innerHTML = items.map(a => `
          <div class="data-row">
            <div>
              <strong>${a.patientName}</strong>
              <span>${new Date(a.scheduledAt).toLocaleString()} · ${a.reason || 'No reason provided'}</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge text-bg-light text-capitalize">${a.status}</span>
              ${a.status === 'confirmed' ? `<button class="btn btn-sm btn-outline-primary" onclick="startVideoCall(${a.id})"><i class="bi bi-camera-video"></i> Video call</button>` : ''}
              ${actions(a)}
            </div>
          </div>
        `).join('');
      }

      function actions(a) {
        if (a.status === 'pending') {
          return button(a.id, 'confirmed', 'Confirm') + ' ' + button(a.id, 'cancelled', 'Cancel', 'outline-danger');
        }
        if (a.status === 'confirmed') {
          return button(a.id, 'completed', 'Mark complete') + ' ' + button(a.id, 'cancelled', 'Cancel', 'outline-danger');
        }
        return '';
      }

      function button(id, status, label, variant) {
        return `<button class="btn btn-sm btn-${variant || 'primary'}" onclick="updateStatus(${id}, '${status}')">${label}</button>`;
      }

      async function updateStatus(id, status) {
        await fetch(`/api/appointments/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ status })
        });
        loadAppointments();
        loadReminders();
      }

      async function startVideoCall(appointmentId) {
        try {
          const res = await fetch('/api/consultations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ appointmentId })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || 'Could not start the video call.');
          }
          const consultation = await res.json();
          window.location.href = `/telemedicine/call/${consultation.id}`;
        } catch (err) {
          alert(err.message);
        }
      }

      document.getElementById('refreshBtn').addEventListener('click', () => { loadAppointments(); loadReminders(); });

      loadAppointments();
      loadReminders();
    </script>
  </body>
</html>
